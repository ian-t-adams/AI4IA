# Dependabot keeps dependencies and CI actions patched. Updates are grouped to
# cut PR noise; security updates come through ungrouped, regardless of the
# schedules below.
#
# That last part holds only while the repo SETTING "Dependabot security updates"
# is on, which this file cannot express and which itself requires "Dependabot
# alerts". Both were off until 2026-08-01, leaving the grouped weekly runs as the
# only channel — and those are minor/patch only, which by construction cannot
# move a transitive dependency that a direct dependency pins by range. Three
# high-severity npm advisories therefore sat open with no path to an automatic
# fix: postcss and sharp (both pinned under `next`), plus brace-expansion, which
# code scanning never reported at all — enabling alerts surfaced it immediately.
# If those settings are turned off again, this file silently stops covering
# security.
#
# Scope: the code we own (app/web npm, app/api uv), the GitHub Actions we run,
# and our service container base images. The vendored proxy/SimpleL7Proxy NuGet
# tree is intentionally pinned to an upstream commit and is left unmanaged here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # `uv`, not `pip`, because app-ci gates `uv lock --check` (added in #222 after
  # the lock silently rotted four pypdf releases behind a live CVE fix). The pip
  # ecosystem edits pyproject.toml and has no knowledge of uv.lock -- and uv.lock
  # records the *declared specifier*, not just resolved versions, so a pure
  # ceiling bump desyncs it even when no package moves. Every Dependabot Python
  # PR therefore failed CI and needed a hand-run `uv lock` (see #230). The uv
  # ecosystem updates pyproject.toml AND uv.lock in one commit, so the gate is
  # satisfied by construction. It supports security updates too, so nothing is
  # given up by the switch. Do not revert to pip while that gate exists --
  # scripts/tests/test_dependabot_config.py fails if the two drift apart.
  - package-ecosystem: uv
    directory: /app/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # Base images track the versions CI actually tests (app-ci pins Node 22 and
  # Python 3.12; docker-build then builds the images at those versions). Major
  # bumps are therefore NOT a dependency decision Dependabot can make on its own:
  # raising the image past the CI toolchain silently ships a runtime no job has
  # ever exercised. That happened twice -- node:22-alpine -> node:26-alpine and
  # python:3.12-slim -> python:3.14-slim both merged unreviewed and were reverted
  # on audit (see AGENTS.md). Majors are ignored so the image and the CI matrix
  # move together, in one deliberate change that updates the workflow, the
  # Dockerfile, and the engines/requires-python floors. Minor/patch (security
  # fixes for the pinned major) still flow through automatically.
  #
  # Both app Dockerfiles now pin `tag@sha256:<digest>` (audit finding P1-7).
  # dependabot-core parses that form (docker/lib/dependabot/docker/file_parser.rb
  # `FROM_LINE`) and rewrites tag and digest together
  # (update_checker.rb `#updated_requirements`), so the pin does not break these
  # ecosystem entries. It does NOT follow that the digest self-refreshes: a
  # digest-only refresh of an unchanged *comparable* tag is suppressed behind
  # dependabot's server-side `docker_digest_only_update_suppression` experiment,
  # whose state is not observable from this repo -- and `22-alpine` / `3.12-slim`
  # are floating tags whose names never change. Refreshing the digest is
  # therefore a manual audit step; the recipe is in each Dockerfile header.
  - package-ecosystem: docker
    directory: /app/api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /app/web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /proxy
    schedule:
      interval: weekly
