name: dependency-lock-refresh

on:
  pull_request:

permissions: {}

jobs:
  public-lock-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Generate telemetry lock against public PyPI
        working-directory: app/api
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
          UV_NO_CONFIG: "1"
        run: |
          python -m pip install --quiet uv==0.12.10
          uv lock --default-index https://pypi.org/simple \
            --upgrade-package azure-monitor-opentelemetry \
            --upgrade-package opentelemetry-instrumentation-httpx
          uv lock --check
      - name: Repair public npm metadata and verify original tarball hashes
        run: |
          node .github/npm-lock-repair.cjs "${GITHUB_WORKSPACE}" "$(npm root -g)/npm"
          python -m unittest scripts.tests.test_lockfile_provenance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-maintenance-locks-${{ github.sha }}
          path: |
            app/api/uv.lock
            app/web/package-lock.json
          if-no-files-found: error
          retention-days: 1
