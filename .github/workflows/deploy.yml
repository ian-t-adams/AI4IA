name: deploy

# Continuous deployment: provision infra + deploy the app to Azure with azd.
#
# Why this exists: app-ci.yml and infra-validate.yml only *validate* (lint /
# build / test). Nothing redeployed on merge, so main could be many commits
# ahead of what is actually running. This workflow closes that gap — once the
# one-time OIDC setup below is done, every merge to main reconciles infra and
# ships the new app images. See docs/runbooks/greenfield-standup.md for setup
# and docs/runbooks/deployment.md for routine operation.
#
# One-time setup (no secrets in this file): create a user-assigned managed
# identity (or app registration) with a GitHub federated credential, grant it
# the subscription roles azd needs, then add these **repository variables**
# (Settings -> Secrets and variables -> Actions -> Variables):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   AZURE_ENV_NAME, AZURE_LOCATION,
#   AI4IA_CLAUDE_ORGANIZATION_NAME, AI4IA_CLAUDE_COUNTRY_CODE,
#   AI4IA_CLAUDE_INDUSTRY
# Set AI4IA_DEPLOYMENT_ENABLED=false to disable deployment explicitly. Otherwise
# the validation job below fails closed when any required identity/environment
# variable is absent; a missing credential must not look like a successful skip.
#
# Custom domains: the bicep binds the web/proxy custom domains + their
# Azure-managed certs only when these repo variables are set. They MUST be
# present in CI or `azd provision` resets the ingress to no custom domain and
# the live site drops to ERR_CONNECTION_CLOSED on the vanity hostname:
#   AI4IA_WEB_CUSTOM_DOMAIN, AI4IA_WEB_MANAGED_CERT_NAME,
#   AI4IA_PROXY_CUSTOM_DOMAIN, AI4IA_PROXY_MANAGED_CERT_NAME
# The *_MANAGED_CERT_NAME values adopt the existing managed cert (no re-issue).

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/**"
      - "proxy/**"
      - "foundry/**"
      - "azure.yaml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/foundry-assets.yml"
      # These files ARE the release path. A script-only bugfix must run once in
      # production to prove itself; before this list existed such a merge sat
      # dormant until an unrelated app/infra change happened to trigger deploy.
      - "scripts/postprovision.ps1"
      - "scripts/post-deploy-verify.py"
      - "scripts/check-resource-providers.py"
      - "scripts/check-model-availability.py"
      - "scripts/validate-feature-prereqs.py"
      - "scripts/provision-foundry-toolbox.py"
      - "scripts/gen-model-catalog.py"
      - "scripts/gen-mcp-catalog.py"
      - "scripts/gen-voice-provider-catalog.py"
      - "scripts/gen-gateway-policy.py"
  workflow_dispatch:
    inputs:
      provision:
        description: "Run azd provision (reconcile infrastructure) before deploy"
        type: boolean
        default: true

# OIDC federated login needs id-token: write. No long-lived credentials.
permissions:
  id-token: write
  contents: read

# Never let two deploys to the same environment overlap; queue, don't cancel,
# so an in-flight provision/deploy is allowed to finish cleanly.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate-deployment-configuration:
    name: validate deployment configuration
    runs-on: ubuntu-latest
    outputs:
      deployment_enabled: ${{ steps.validate.outputs.deployment_enabled }}
    env:
      AI4IA_DEPLOYMENT_ENABLED: ${{ vars.AI4IA_DEPLOYMENT_ENABLED }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AI4IA_CLAUDE_ORGANIZATION_NAME: ${{ vars.AI4IA_CLAUDE_ORGANIZATION_NAME }}
      AI4IA_CLAUDE_COUNTRY_CODE: ${{ vars.AI4IA_CLAUDE_COUNTRY_CODE }}
      AI4IA_CLAUDE_INDUSTRY: ${{ vars.AI4IA_CLAUDE_INDUSTRY }}
    steps:
      - name: Validate required deployment variables
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          case "${AI4IA_DEPLOYMENT_ENABLED,,}" in
            false)
              echo "deployment_enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Deployment is explicitly disabled by AI4IA_DEPLOYMENT_ENABLED=false."
              exit 0
              ;;
            ""|true)
              ;;
            *)
              echo "::error::AI4IA_DEPLOYMENT_ENABLED must be true, false, or unset; got '${AI4IA_DEPLOYMENT_ENABLED}'."
              exit 1
              ;;
          esac

          missing=()
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_ENV_NAME \
            AZURE_LOCATION \
            AI4IA_CLAUDE_ORGANIZATION_NAME \
            AI4IA_CLAUDE_COUNTRY_CODE \
            AI4IA_CLAUDE_INDUSTRY
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            printf -v missing_names '%s, ' "${missing[@]}"
            echo "::error::Deployment is enabled but required repository variables are missing: ${missing_names%, }. Configure them under Settings > Secrets and variables > Actions > Variables, or set AI4IA_DEPLOYMENT_ENABLED=false to declare an intentional disabled posture."
            exit 1
          fi

          echo "deployment_enabled=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: validate-deployment-configuration
    if: ${{ needs.validate-deployment-configuration.outputs.deployment_enabled == 'true' }}
    runs-on: ubuntu-latest
    # 180, not the usual 60: a cancelled `azd provision` does not fail cleanly. GitHub marks a
    # timed-out job "cancelled" and kills azd mid-flight, but ARM keeps the in-flight deployment
    # ACTIVE for up to 7 days, and every later deploy then fails validation with
    # `DeploymentActive: ... cannot be saved, because this would overwrite an existing deployment
    # which is still active`. So an under-set timeout does not cost one run, it wedges the
    # subscription until someone runs `az deployment group cancel` (see
    # docs/runbooks/deployment.md "Recovering from a cancelled or timed-out provision").
    # This is not hypothetical: run 30594... timed out at exactly 60m mid-`apicenter` and blocked
    # the next four deploys. That was an INCREMENTAL provision; a cold first provision in a new
    # tenant is strictly slower (APIM alone is 30-45m, plus Foundry accounts and ~70 model
    # deployments across two regions), which is precisely the migration cutover run. The risk is
    # asymmetric -- an over-set timeout wastes runner minutes on a genuinely hung run, an under-set
    # one costs a 7-day outage -- so this is sized for the cold case with headroom.
    timeout-minutes: 180
    # A GitHub Environment gives you an approval gate + scoped vars/secrets.
    # Referencing it auto-creates it (no protection) until you add reviewers.
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      # Anthropic Marketplace attestation. These values auto-accept the offer
      # through modelProviderData and must describe the real legal entity.
      AI4IA_CLAUDE_ORGANIZATION_NAME: ${{ vars.AI4IA_CLAUDE_ORGANIZATION_NAME }}
      AI4IA_CLAUDE_COUNTRY_CODE: ${{ vars.AI4IA_CLAUDE_COUNTRY_CODE }}
      AI4IA_CLAUDE_INDUSTRY: ${{ vars.AI4IA_CLAUDE_INDUSTRY }}
      # Custom-domain + managed-cert binding. Empty -> bicep leaves the ingress
      # with no custom domain (azd would otherwise wipe an imperatively-bound
      # hostname on every deploy). Set as repo variables; see header.
      AI4IA_WEB_CUSTOM_DOMAIN: ${{ vars.AI4IA_WEB_CUSTOM_DOMAIN }}
      AI4IA_WEB_MANAGED_CERT_NAME: ${{ vars.AI4IA_WEB_MANAGED_CERT_NAME }}
      AI4IA_PROXY_CUSTOM_DOMAIN: ${{ vars.AI4IA_PROXY_CUSTOM_DOMAIN }}
      AI4IA_PROXY_MANAGED_CERT_NAME: ${{ vars.AI4IA_PROXY_MANAGED_CERT_NAME }}
      # Multi-application gateway controls are default-off. The profile projection
      # is a secret and validation refuses profile enablement until the edge has a
      # verified workload identity rather than the temporary shared-key contract.
      AI4IA_PROXY_PROFILES_ENABLED: ${{ vars.AI4IA_PROXY_PROFILES_ENABLED }}
      AI4IA_PROXY_PROFILE_PROJECTION_JSON: ${{ secrets.AI4IA_PROXY_PROFILE_PROJECTION_JSON }}
      AI4IA_PROXY_PRIORITIES_ENABLED: ${{ vars.AI4IA_PROXY_PRIORITIES_ENABLED }}
      AI4IA_PROXY_PRIORITY_WORKERS: ${{ vars.AI4IA_PROXY_PRIORITY_WORKERS }}
      AI4IA_PROXY_EVENTHUB_TELEMETRY_ENABLED: ${{ vars.AI4IA_PROXY_EVENTHUB_TELEMETRY_ENABLED }}
      AI4IA_PROXY_ASYNC_ENABLED: ${{ vars.AI4IA_PROXY_ASYNC_ENABLED }}
      AI4IA_PROXY_WORKERS: ${{ vars.AI4IA_PROXY_WORKERS }}
      AI4IA_PROXY_MIN_REPLICAS: ${{ vars.AI4IA_PROXY_MIN_REPLICAS }}
      AI4IA_PROXY_MAX_REPLICAS: ${{ vars.AI4IA_PROXY_MAX_REPLICAS }}
      AI4IA_PROXY_APPCONFIG_LABEL: ${{ vars.AI4IA_PROXY_APPCONFIG_LABEL }}
      AI4IA_APP_ENVIRONMENT: ${{ vars.AI4IA_APP_ENVIRONMENT }}
      # Production defaults OpenAPI/schema/docs off; this explicit override is
      # server-enforced and reaches Bicep through main.parameters.json.
      AI4IA_OPENAPI_ENABLED: ${{ vars.AI4IA_OPENAPI_ENABLED }}
      AI4IA_AUTH_PROVIDER: ${{ vars.AI4IA_AUTH_PROVIDER }}
      # Default false. Setting it true makes a deployed environment derive
      # identity from the client-supplied X-Dev-User header, so it is only
      # ever appropriate for a throwaway demo without Entra. `prod` ignores
      # it entirely (main.bicep forces false).
      AI4IA_ALLOW_DEV_AUTH: ${{ vars.AI4IA_ALLOW_DEV_AUTH }}
      AI4IA_ENTRA_TENANT_ID: ${{ vars.AI4IA_ENTRA_TENANT_ID }}
      AI4IA_ENTRA_AUDIENCE: ${{ vars.AI4IA_ENTRA_AUDIENCE }}
      AI4IA_ENTRA_WEB_CLIENT_ID: ${{ vars.AI4IA_ENTRA_WEB_CLIENT_ID }}
      AI4IA_ENTRA_API_SCOPE: ${{ vars.AI4IA_ENTRA_API_SCOPE }}
      AI4IA_ADMIN_SUBJECTS: ${{ vars.AI4IA_ADMIN_SUBJECTS }}
      # Same failure mode as AI4IA_MEMORY_STORE below: main.parameters.json reads
      # these through ${VAR=default}, but azd only substitutes what is present in the
      # environment. Anything not plumbed here silently deploys its placeholder no
      # matter what the repo variable says -- which is how the live APIM ended up on
      # ai4ia@example.com and every resource on owner=ai4ia-operator while both repo
      # variables were set. greenfield-standup.md section 3 lists all of these as
      # required for a new-tenant standup, so they must be reachable from CI.
      AI4IA_APIM_PUBLISHER_EMAIL: ${{ vars.AI4IA_APIM_PUBLISHER_EMAIL }}
      AI4IA_OWNER: ${{ vars.AI4IA_OWNER }}
      AI4IA_COST_CENTER: ${{ vars.AI4IA_COST_CENTER }}
      # The workload token names the resource group and every APIM child credential.
      # It is also read directly by the custom-domain preflight step below, which must
      # look in the same resource group bicep creates.
      AI4IA_WORKLOAD: ${{ vars.AI4IA_WORKLOAD }}
      # Regional escape hatches. These exist because Postgres, Search, and API Center
      # are each capacity/offer constrained per region and are the documented remedy
      # for LocationIsOfferRestricted (deployment.md section 7.1) -- a remedy that does
      # not work if the pipeline cannot pass the override.
      # No `|| 'default'` fallback on purpose: none of these three has a repo variable
      # today, so Actions expands them to '', and azd resolves an empty ${VAR=default}
      # to the default (verified live -- they landed on centralus/eastus/eastus). A
      # fallback here would be dead weight that has to be kept in sync with
      # main.parameters.json by hand. Do not "harden" this; see
      # greenfield-standup.md section 3.
      AI4IA_POSTGRES_LOCATION: ${{ vars.AI4IA_POSTGRES_LOCATION }}
      AI4IA_SEARCH_LOCATION: ${{ vars.AI4IA_SEARCH_LOCATION }}
      AI4IA_API_CENTER_LOCATION: ${{ vars.AI4IA_API_CENTER_LOCATION }}
      # Extra browser origins for Voice Live. Bicep already derives the deployed web
      # origin, so this stays empty for a normal standup; it is the documented knob for
      # additional origins and must not be silently unreachable.
      AI4IA_REALTIME_ALLOWED_ORIGINS: ${{ vars.AI4IA_REALTIME_ALLOWED_ORIGINS }}
      # Secret, not a variable (cf. AI4IA_WEBIQ_API_KEY). Empty keeps the admin API on
      # Entra managed identity rather than a shared key.
      AI4IA_ADMIN_API_SECRET: ${{ secrets.AI4IA_ADMIN_API_SECRET }}
      # Post-deploy verification (audit finding P1-6). NOT an azd parameter -- it is
      # read only by the steps at the bottom of this job, so it deliberately has no
      # ${...} token in main.parameters.json. Set it to `false` to drop the
      # authenticated FastAPI -> SimpleL7Proxy -> APIM -> Foundry canary; the
      # rollout, health, web, proxy, and custom-domain assertions still run and are
      # not optional. Turning the canary off means a deploy is proven only as far as
      # the ingress: an APIM key, gateway policy, or model-deployment regression will
      # ship green. See docs/runbooks/deployment.md section 6.
      AI4IA_DEPLOY_VERIFY_CANARY: ${{ vars.AI4IA_DEPLOY_VERIFY_CANARY }}
      # Canonical memory backend selection for the staged mem0 -> Cosmos cutover.
      # main.parameters.json resolves memoryStore from ${AI4IA_MEMORY_STORE=cosmos};
      # CI can't run `azd env set`, so plumb it here or the parameter never sees the
      # repo variable at all. This carried a `|| 'disabled'` fallback while the
      # migration was staged, to keep the provisioned Cosmos `memories` container
      # inactive until the cutover was applied and verified. That cutover is done --
      # the repo variable and the live container app are both `cosmos` -- and the
      # fallback had become a second, divergent default shadowing the parameter file
      # (which says `cosmos`), so it is gone. See docs/runbooks/memory-migration.md.
      AI4IA_MEMORY_STORE: ${{ vars.AI4IA_MEMORY_STORE }}
      # Identity-only auth on the Foundry accounts (audit P1-4a). Default true in
      # main.parameters.json, and plumbed here for the same reason as the vars
      # above: unplumbed, the repo variable would be unreadable and the escape
      # hatch inert. Leave it UNSET in normal operation -- azd resolves an unset
      # variable to the parameter default, which is the secure value. Set it to
      # `false` only to recover from a proven key dependency, and record why:
      # with local auth enabled, anything holding a Cognitive Services account
      # key can reach a Foundry deployment directly and skip APIM.
      AI4IA_FOUNDRY_DISABLE_LOCAL_AUTH: ${{ vars.AI4IA_FOUNDRY_DISABLE_LOCAL_AUTH }}
      # Speech Voice Live is a second, additive realtime provider fronted by the
      # SAME shared active APIM (a dedicated /speech/voice-live/realtime
      # WebSocket API + distinct subscription key; see infra/modules/gateway.bicep).
      # Default OFF: without AI4IA_SPEECH_VOICE_LIVE_ENABLED=true the provider
      # never enters the allowlist and the relay never selects it, so the
      # default Azure OpenAI Realtime path is unchanged. Enabling this in
      # production additionally remains gated on the pending live-validation
      # confirmation recorded in .azure/plan.md (managed-identity audience +
      # account posture) -- do not set this true before that gate closes. The
      # base URL/gateway key are NOT set here; they come from gateway.bicep's
      # dedicated APIM subscription output, matching the realtime provider
      # pattern (never a repo variable/secret).
      AI4IA_SPEECH_VOICE_LIVE_ENABLED: ${{ vars.AI4IA_SPEECH_VOICE_LIVE_ENABLED }}
      AI4IA_VOICE_PROVIDER_ALLOWLIST: ${{ vars.AI4IA_VOICE_PROVIDER_ALLOWLIST }}
      AI4IA_VOICE_DEFAULT_PROVIDER: ${{ vars.AI4IA_VOICE_DEFAULT_PROVIDER }}
      AI4IA_SPEECH_VOICE_LIVE_MI_AUDIENCE: ${{ vars.AI4IA_SPEECH_VOICE_LIVE_MI_AUDIENCE }}
      # Budget start date pin. Empty -> bicep uses the first of the current month
      # (drifts, so the first deploy of each new month fails on the immutable
      # budget start date). Set this repo variable to a fixed yyyy-MM-01 to keep
      # redeploys idempotent. See docs/runbooks/deployment.md.
      AI4IA_BUDGET_START_DATE: ${{ vars.AI4IA_BUDGET_START_DATE }}
      # Azure Monitor alerting baseline (action group + api 5xx / Cosmos 429 metric
      # alerts). Default OFF so merging is inert; to turn proactive alerts on, set the
      # AI4IA_ENABLE_ALERTS repo variable to 'true' AND set AI4IA_ALERT_EMAIL to a
      # recipient (an enabled action group with no receiver notifies no one). See
      # infra/modules/alerts.bicep and docs/roadmap.md.
      AI4IA_ENABLE_ALERTS: ${{ vars.AI4IA_ENABLE_ALERTS }}
      AI4IA_ALERT_EMAIL: ${{ vars.AI4IA_ALERT_EMAIL }}
      # Key Vault purge protection. Default OFF so the wipe-and-rebuild workflow can
      # purge and recreate the vault under the same name. Setting this to 'true' is
      # IRREVERSIBLE -- Azure offers no way back, and the vault name stays reserved
      # for the soft-delete retention window, which blocks a teardown-and-redeploy of
      # the same environment name. See docs/runbooks/deployment.md.
      AI4IA_KEYVAULT_PURGE_PROTECTION: ${{ vars.AI4IA_KEYVAULT_PURGE_PROTECTION }}
      # Durable workflow execution (Azure Durable Task Scheduler). Turning it on
      # PROVISIONS A PAID RESOURCE (a DTS scheduler + task hub), so the posture
      # lives in main.parameters.json and this only carries the override. Runs
      # that do not pass "durable": true are unaffected either way.
      # Do NOT add `|| 'false'` style fallbacks to the three below: azd's
      # ${VAR=default} already behaves like POSIX ${VAR:-default}, so an unset
      # repo variable correctly takes the parameter default (see
      # greenfield-standup.md §3). This line carried one anyway, directly under
      # this comment, and it
      # silently pinned the deploy to `false` for a full release after the
      # parameter default was changed to `true` -- the parameter file said the
      # feature was on, no scheduler was ever provisioned, and the deploy stayed
      # green because a shadowed default fails silently by construction.
      # See infra/modules/durabletask.bicep.
      AI4IA_ENABLE_DURABLE_WORKFLOWS: ${{ vars.AI4IA_ENABLE_DURABLE_WORKFLOWS }}
      AI4IA_DURABLE_TASK_SKU: ${{ vars.AI4IA_DURABLE_TASK_SKU }}
      AI4IA_DURABLE_WORKFLOW_TIMEOUT_SECONDS: ${{ vars.AI4IA_DURABLE_WORKFLOW_TIMEOUT_SECONDS }}
      # Web IQ API key. This is a SECRET (not a repo variable). Web search is
      # enabled in main.parameters.json, so if this is empty at provision time
      # bicep drops the webiq-api-key Container App secret and falls back to the
      # api managed identity -- which is NOT entitled to Web IQ, so live search
      # 401s. Set it as a `production` environment secret (Settings -> Environments
      # -> production -> Secrets). Empty preserves the managed-identity fallback.
      AI4IA_WEBIQ_API_KEY: ${{ secrets.AI4IA_WEBIQ_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install azd
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0
        with:
          version: 1.29.0

      - name: Verify azd version
        shell: bash
        run: |
          set -euo pipefail
          installed="$(azd version)"
          if ! grep -Eq '^azd version 1\.29\.0($|[ (])' <<< "$installed"; then
            echo "::error::Expected azd 1.29.0 because digest deployment behavior is verified against that release; found: $installed"
            exit 1
          fi

      - name: Log in to Azure (OIDC federated credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      # az login for the guard steps below (azd auth doesn't authenticate the az
      # CLI). Same OIDC identity, no secrets.
      #
      # Unconditional, unlike the provision-only preflights that follow. The
      # post-deploy verification and rollback steps at the bottom of this job read
      # revisions and, on failure, restore one -- and they must work on a
      # `workflow_dispatch` run that skips provisioning, which is exactly the run an
      # operator uses to redeploy app images against unchanged infra. Gating this
      # login on `inputs.provision` would leave those runs with no verification at
      # all and no way to roll back.
      - name: Log in to Azure CLI (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deploy principal ID for Foundry and API Center data-plane setup
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.provision }}
        shell: bash
        run: |
          set -euo pipefail
          # RBAC needs the service principal OBJECT id. AZURE_CLIENT_ID is the
          # application/client id; az accepts that wrong GUID with
          # --assignee-object-id and silently creates a useless assignment.
          # Prefer ARM discovery for the documented UAMI setup, then support an
          # app-registration setup through Graph as a fallback.
          principal_id="$(az identity list \
            --query "[?clientId=='${AZURE_CLIENT_ID}'].principalId | [0]" \
            -o tsv)"
          if [ -z "$principal_id" ]; then
            principal_id="$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv 2>/dev/null || true)"
          fi
          if [ -z "$principal_id" ]; then
            echo "::error::Could not resolve the deploy identity's principal/object id from AZURE_CLIENT_ID. Set up the documented user-assigned identity, or grant the app registration enough directory read access to resolve itself."
            exit 1
          fi
          # AZURE_PRINCIPAL_ID is azd's native name for this value; exporting it
          # here makes the Bicep substitution deterministic in both azd and the
          # workflow rather than inventing a second variable for the same fact.
          echo "AZURE_PRINCIPAL_ID=$principal_id" >> "$GITHUB_ENV"
          echo "Resolved the deploy principal id for Content Understanding, Foundry assets, and API Center catalog access."

      - name: Validate generated gateway and deployment prerequisites
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.provision }}
        run: |
          python scripts/gen-model-catalog.py --check
          python scripts/gen-mcp-catalog.py --check
          python scripts/gen-voice-provider-catalog.py --check
          python scripts/gen-gateway-policy.py --check
          python scripts/validate-feature-prereqs.py

      # A resource provider that is not registered fails the deployment PARTWAY
      # THROUGH, ~10+ minutes in, with `MissingSubscriptionRegistration` -- after
      # real resources already exist. The runbook has always listed this as manual
      # step 0, which protects a greenfield standup but not the routine path where
      # a NEW provider arrives with a feature: enabling durable workflows added
      # `Microsoft.DurableTask` to the derived set and it was NotRegistered in the
      # live subscription, because a flag-gated module never submits its resource
      # type while the flag is off, so ARM had no occasion to register it.
      #
      # The required set is derived from infra/**/*.bicep, so this covers providers
      # added after this step was written without anyone remembering to edit a list.
      # `--register` rather than report-only: registration is idempotent,
      # subscription-scoped, non-destructive, and already granted by the deploy
      # identity's Contributor role, so self-healing in ~a minute beats failing a
      # change window over a one-line fix.
      - name: Preflight resource provider registration
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.provision }}
        run: python scripts/check-resource-providers.py --register

      # Two jobs, both of which bicep cannot do for itself. Container App names are
      # deterministic from AZURE_ENV_NAME; the resource group additionally depends on
      # the workload token, which is why it is derived rather than literal below.
      #
      # 1. Guard: a provision rewrites the Container App ingress from the bicep, which
      #    sets customDomains to [] when AI4IA_*_CUSTOM_DOMAIN is empty -> it WIPES an
      #    existing vanity-host binding (live site drops to ERR_CONNECTION_CLOSED; see
      #    docs/runbooks/deployment.md). Bicep can't see the live binding to refuse, so
      #    fail fast here when an app already has a domain bound but the matching repo
      #    variable is empty.
      # 2. First-bind bootstrap: Container Apps rejects a managed certificate whose
      #    hostname is not already a custom hostname in the environment, and ARM creates
      #    the cert before the ingress that would introduce it -- so the very first bind
      #    of a hostname can never converge in a single pass, no matter the ordering
      #    inside bicep. Register it here first; bicep still owns the durable binding.
      - name: Preflight custom-domain bindings (guard wipes, register first binds)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.provision }}
        run: |
          set -euo pipefail
          # Must match infra/main.bicep's `rg-${workload}-${environmentName}`. Hardcoding
          # the workload token here would send every lookup below to a resource group
          # that does not exist for a renamed workload -- and `guard` treats a missing
          # app as "nothing bound", so the whole step would silently no-op instead of
          # failing. Default matches the bicep parameter default.
          rg="rg-${AI4IA_WORKLOAD:-ai4ia}-${AZURE_ENV_NAME}"
          rc=0
          guard() {
            app="$1"; var_name="$2"; var_val="$3"
            bound=""
            if az containerapp show -g "$rg" -n "$app" -o none 2>/dev/null; then
              # Present but domain-less prints nothing, same as a missing app --
              # hence the separate existence probe above.
              bound="$(az containerapp show -g "$rg" -n "$app" \
                --query "properties.configuration.ingress.customDomains[].name" -o tsv 2>/dev/null || true)"
            else
              if [ -n "$var_val" ]; then
                echo "::error::$app does not exist yet but $var_name is set to '$var_val'. That is the wrong order for a new tenant: the managed certificate needs the app, and DNS has to point at an environment that exists. Clear $var_name (and its *_MANAGED_CERT_NAME), provision once, cut DNS over, then re-run. See docs/runbooks/greenfield-standup.md section 6.2."
                rc=1
              else
                echo "OK: $app does not exist yet and $var_name is empty (correct greenfield order)."
              fi
              return 0
            fi

            if [ -n "$bound" ] && [ -z "$var_val" ]; then
              echo "::error::$app has custom domain(s) bound [$(echo "$bound" | paste -sd, -)] but $var_name is empty. Provisioning would WIPE the binding. Set $var_name (and its *_MANAGED_CERT_NAME) as a repo variable, then re-run."
              rc=1
            elif [ -z "$var_val" ]; then
              echo "OK: $app has no binding and $var_name is empty (nothing to protect)."
            elif echo "$bound" | grep -qxF "$var_val"; then
              echo "OK: $app already has $var_val registered; bicep will assert its cert and SNI binding."
            else
              # First bind of THIS hostname. Container Apps refuses to create a
              # managed certificate for a hostname that is not already a custom
              # hostname somewhere in the environment (RequireCustomHostnameInEnvironment),
              # but bicep declares the cert and the ingress binding together and ARM
              # orders the cert first -- so a first bind cannot converge in one pass.
              # Register the hostname here with binding disabled (no cert needed) and
              # let bicep do the half it can: issue the cert and flip to SniEnabled.
              # `hostname add` is also where Azure validates domain control, so a DNS
              # mistake fails in seconds here instead of ~20 minutes into provisioning.
              echo "Registering $var_val on $app (binding disabled) so ARM can issue its managed certificate..."
              if az containerapp hostname add -g "$rg" -n "$app" --hostname "$var_val" -o none; then
                echo "OK: $var_val registered; bicep will issue the cert and switch it to SniEnabled."
              else
                echo "::error::Could not register $var_val on $app. Azure validates domain control here, so public DNS must ALREADY have: CNAME $var_val -> the app's <name>.<envdomain>.azurecontainerapps.io FQDN, and TXT asuid.$var_val = the app's customDomainVerificationId. Confirm with a public resolver (your corporate resolver may still cache the old target). See docs/runbooks/greenfield-standup.md section 6.2."
                rc=1
              fi
            fi
            return 0
          }
          guard "ca-web-${AZURE_ENV_NAME}"   "AI4IA_WEB_CUSTOM_DOMAIN"   "${AI4IA_WEB_CUSTOM_DOMAIN:-}"
          guard "ca-proxy-${AZURE_ENV_NAME}" "AI4IA_PROXY_CUSTOM_DOMAIN" "${AI4IA_PROXY_CUSTOM_DOMAIN:-}"
          exit $rc

      # Capture BEFORE ARM can touch the Container Apps. The app modules need an
      # image in every template and their greenfield defaults are quickstart
      # placeholders; an infra reconciliation can therefore create a placeholder
      # revision before the release images are built. Capturing afterward would
      # record that placeholder as the rollback target. `capture` records
      # exists:false for missing greenfield apps, so this ordering also supports a
      # first stand-up.
      - name: Capture pre-provision revisions (rollback target)
        id: capture
        run: |
          set -euo pipefail
          python scripts/post-deploy-verify.py capture \
            --state "${RUNNER_TEMP}/ai4ia-deploy-state.json"

      - name: Provision infrastructure
        id: provision
        # Skipped only when a manual run explicitly opts out; push events always
        # reconcile infra (azd provision is idempotent).
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.provision }}
        run: azd provision --no-prompt

      # Preserve the endpoint produced by THIS successful provision for the
      # workflow_run consumer. A GitHub variable can fall back across scopes and
      # therefore cannot prove which deployment it names.
      - name: Prepare Foundry asset handoff
        if: ${{ steps.provision.outcome == 'success' }}
        run: |
          set -euo pipefail
          endpoint="$(azd env get-value AZURE_FOUNDRY_PROJECT_ENDPOINT)"
          mkdir -p "${RUNNER_TEMP}/foundry-assets-context"
          if [ -z "$endpoint" ]; then
            printf 'false\n' > "${RUNNER_TEMP}/foundry-assets-context/enabled.txt"
          elif [[ "$endpoint" =~ ^https://[a-z0-9][a-z0-9-]{0,59}\.services\.ai\.azure\.com/api/projects/[a-z0-9][a-z0-9-]{0,59}$ ]]; then
            printf 'true\n' > "${RUNNER_TEMP}/foundry-assets-context/enabled.txt"
            printf '%s\n' "$endpoint" > "${RUNNER_TEMP}/foundry-assets-context/project-endpoint.txt"
          else
            echo "::error::Provision produced an invalid Foundry project endpoint."
            exit 1
          fi

      - name: Retain Foundry asset handoff
        if: ${{ steps.provision.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-assets-context
          path: ${{ runner.temp }}/foundry-assets-context
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------
      # Build each service image ONCE, push it, and record the digest the
      # registry assigned (audit finding P1-7).
      #
      # `azd deploy` builds all three images from source at deploy time, so the
      # artifact that runs in production was never the artifact CI tested: same
      # source, different build, different moment, and -- until the base images
      # were digest-pinned alongside this change -- potentially a different
      # `node:22-alpine` / `python:3.12-slim` underneath. Nothing recorded which
      # bytes were live. Building here and handing the resulting digest to
      # `azd deploy --from-package` below removes the rebuild and makes the
      # running revision traceable to a commit.
      #
      # Verified against the azd source at tag azure-dev-cli_1.29.0, the version
      # Azure/setup-azd installs for this workflow:
      #   * internal/cmd/service_graph.go -- with --from-package set, azd injects
      #     the supplied artifact directly and never calls serviceManager.Package,
      #     so no `docker build` runs.
      #   * pkg/project/service_target_containerapp.go `Publish` -- when the
      #     reference parses AND carries a registry, azd skips ACR login/tag/push
      #     and forwards `Location: packagePath`, the ORIGINAL string. The digest
      #     is not re-resolved, re-tagged or re-pushed.
      #   * pkg/tools/docker/container_image.go `ParseContainerImage` -- has no
      #     first-class digest concept, but for `<host>.azurecr.io/repo@sha256:x`
      #     it returns no error and sets Registry from the leading dot-bearing
      #     segment, which is the only field the shortcut above reads. A
      #     registry-LESS reference would silently fall back to azd's own push,
      #     hence the fully-qualified login server and the dot assertion below.
      #
      # The rollback target is already captured because provision may have touched
      # the running app templates. A build failure after provision therefore
      # restores the pre-provision revisions. On a manual run that skipped
      # provision, the rollback condition below does not restore anything unless
      # application deployment itself was attempted.
      #
      # Repository names match azd's own DefaultImageName
      # (`<project>/<service>-<env>`, lowercased -- pkg/project/container_helper.go)
      # so a local `azd deploy` and this workflow keep writing to the same ACR
      # repositories instead of forking into two parallel sets.
      - name: Build and push service images, recording their digests
        id: images
        timeout-minutes: 45
        run: |
          set -euo pipefail
          # Same derivation as the custom-domain preflight above: must match
          # infra/main.bicep's `rg-${workload}-${environmentName}`.
          rg="rg-${AI4IA_WORKLOAD:-ai4ia}-${AZURE_ENV_NAME}"
          registry="$(az acr list -g "$rg" --query "[].loginServer" -o tsv)"
          if [ "$(printf '%s\n' "$registry" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected exactly one container registry in $rg, found: $(printf '%s' "$registry" | tr '\n' ' '). infra/modules/containerapps.bicep creates one; deploying by digest needs to know which one holds the images."
            exit 1
          fi
          case "$registry" in
            *.*) ;;
            *)
              echo "::error::Registry login server '$registry' has no dot, so azd's ParseContainerImage would not detect a registry and azd would silently rebuild and push the image itself -- exactly what this step exists to prevent."
              exit 1
              ;;
          esac
          az acr login --name "${registry%%.*}"

          env_slug="$(printf '%s' "$AZURE_ENV_NAME" | tr '[:upper:]' '[:lower:]')"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "### Deployed image digests"
            echo ""
            echo "Built once from \`${GITHUB_SHA}\` and deployed by digest; no rebuild happens inside \`azd deploy\`."
            echo ""
            echo "| service | image |"
            echo "| --- | --- |"
          } >> "$summary"

          # service:build-context. Contexts match azure.yaml's service projects
          # and docker-build.yml's PR-time builds.
          for entry in "web:app/web" "api:app/api" "proxy:proxy"; do
            service="${entry%%:*}"
            context="${entry#*:}"
            ref="${registry}/ai4ia/${service}-${env_slug}"
            echo "::group::build ${service} (${context})"
            # --platform is explicit rather than inherited from the runner: azd's
            # own docker.platform default is linux/amd64 and Container Apps runs
            # linux/amd64, so an arm64 runner would otherwise push an image that
            # provisions fine and never starts.
            docker build --platform linux/amd64 \
              --file "${context}/Dockerfile" --tag "${ref}:${GITHUB_SHA}" "${context}"
            docker push "${ref}:${GITHUB_SHA}"
            echo "::endgroup::"
            # RepoDigests is populated by the push and is the digest the REGISTRY
            # computed, not a local guess. Filtered to this exact repository
            # because an image can carry several.
            digest="$(docker image inspect "${ref}:${GITHUB_SHA}" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              | sed -n "s|^${ref}@||p" | head -n 1)" || digest=""
            case "$digest" in
              sha256:*) ;;
              *)
                echo "::error::Could not read a registry digest for ${ref}:${GITHUB_SHA} after pushing it. Falling back to the mutable tag would reintroduce the very ambiguity this change removes, so the run stops here."
                exit 1
                ;;
            esac
            echo "${service}_image=${ref}@${digest}" >> "$GITHUB_OUTPUT"
            echo "${service} -> ${ref}@${digest}"
            echo "| ${service} | \`${ref}@${digest}\` |" >> "$summary"
          done

      # ---------------------------------------------------------------------
      # Post-deploy proof and rollback (audit finding P1-6).
      #
      # `azd deploy` exiting 0 means ARM accepted a new Container App template.
      # It does NOT mean the app runs. A crash-looping image, an unbound secret,
      # a Python import error, a stale APIM route or a gateway policy that no
      # longer matches the catalog all finish as a GREEN deploy, and the first
      # person to find out is a user. azure.yaml's postprovision hook cannot
      # close this: it runs BEFORE application deployment, when the api container
      # may still be the azd placeholder image, which is exactly why it treats
      # app probes as best-effort.
      #
      # So: preserve the pre-provision target, reconcile/build/deploy, then assert
      # and restore on failure.
      # ---------------------------------------------------------------------
      # Deliberately BEFORE `azd deploy`. If the deploy identity cannot obtain a
      # token for the API audience, that is a gate misconfiguration, not a bad
      # release -- and discovering it after deployment would roll back a healthy
      # app for a reason that has nothing to do with it. Failing here costs
      # nothing: the images are already in ACR, but no revision has been touched,
      # so an unreferenced image tag is all that is left behind.
      #
      # The token acquired here is DISCARDED. Verification acquires a fresh one,
      # because a three-image `azd deploy` plus a retried rollout can put a long
      # gap between this step and the canary, and an expired token would present
      # as a 401 -- i.e. would roll back a healthy release.
      - name: Preflight the post-deploy canary token
        run: |
          set -euo pipefail
          if [ "${AI4IA_DEPLOY_VERIFY_CANARY:-}" = "false" ]; then
            echo "::warning::AI4IA_DEPLOY_VERIFY_CANARY=false, so this deploy will not be proven end to end. The rollout, health, web, proxy and custom-domain assertions still run, but nothing will exercise SimpleL7Proxy -> APIM -> Foundry."
            exit 0
          fi
          if [ -z "${AI4IA_ENTRA_AUDIENCE:-}" ]; then
            echo "::error::AI4IA_ENTRA_AUDIENCE is empty, so there is no API audience to request a token for and the post-deploy canary cannot run. A deploy that silently skips its own end-to-end proof is the failure mode this gate exists to remove. Set the variable (docs/runbooks/greenfield-standup.md section 4), or set AI4IA_DEPLOY_VERIFY_CANARY=false to skip the canary deliberately and visibly."
            exit 1
          fi
          if ! az account get-access-token --resource "$AI4IA_ENTRA_AUDIENCE" --query accessToken -o tsv >/dev/null 2>&1; then
            echo "::error::The deploy identity could not obtain an access token for the API audience in AI4IA_ENTRA_AUDIENCE, so the post-deploy canary could not run. The API app registration needs a service principal in this tenant (scripts/provision-entra-apps.ps1 runs 'az ad sp create'), and if that app requires assignment, the deploy identity needs an app role on it. Fix the grant, or set AI4IA_DEPLOY_VERIFY_CANARY=false to ship without end-to-end proof."
            exit 1
          fi
          echo "The deploy identity can obtain a token for the API audience."

      # One invocation per service, by digest. azd rejects `--from-package`
      # together with `--all` and requires a named service
      # (internal/cmd/deploy.go: ErrFromPackageWithAll / ErrFromPackageNoService),
      # so the previous single `azd deploy --no-prompt` cannot carry a package.
      # Sequential rather than parallel because each invocation writes
      # SERVICE_<NAME>_IMAGE_NAME back into the azd environment file.
      #
      # The service list is asserted against azure.yaml by
      # scripts/tests/test_immutable_image_promotion.py: a service added there
      # but not here would silently stop being deployed, which the old
      # deploy-everything form could not do.
      - name: Deploy application
        id: deploy
        env:
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          PROXY_IMAGE: ${{ steps.images.outputs.proxy_image }}
        run: |
          set -euo pipefail
          for pair in "web:$WEB_IMAGE" "api:$API_IMAGE" "proxy:$PROXY_IMAGE"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::No image digest was recorded for ${pair%%:*}. azd would treat an empty --from-package as 'build it yourself', reintroducing the deploy-time rebuild, so this run stops instead."
              exit 1
            fi
          done
          azd deploy web --from-package "$WEB_IMAGE" --no-prompt
          azd deploy api --from-package "$API_IMAGE" --no-prompt
          azd deploy proxy --from-package "$PROXY_IMAGE" --no-prompt

      # Separate from the verification step on purpose. A token problem here is
      # not evidence the release is bad, and the rollback below is gated on this
      # step's outcome so it cannot revert a healthy deploy over one. The
      # preflight above already proved the grant exists, so a failure at this
      # point is transient -- hence the retries.
      - name: Acquire the canary token for verification
        id: canary_token
        run: |
          set -euo pipefail
          if [ "${AI4IA_DEPLOY_VERIFY_CANARY:-}" = "false" ]; then
            echo "Canary disabled; no token needed."
            exit 0
          fi
          token=""
          for _ in 1 2 3; do
            if token="$(az account get-access-token --resource "$AI4IA_ENTRA_AUDIENCE" --query accessToken -o tsv 2>/dev/null)" && [ -n "$token" ]; then
              break
            fi
            token=""
            sleep 10
          done
          if [ -z "$token" ]; then
            echo "::error::Could not obtain a canary token even though the pre-deploy preflight could. That is an Entra or network problem, not a bad release, so this run stops WITHOUT rolling back. The deploy is live but unverified -- check it, then re-run the workflow."
            exit 1
          fi
          # Masked as defence in depth. The verification script never prints the
          # token, but anything else in this job that echoed it would be scrubbed.
          echo "::add-mask::$token"
          echo "AI4IA_DEPLOY_CANARY_TOKEN=$token" >> "$GITHUB_ENV"

      # Every assertion here is a hard gate. A failure fails the job AND triggers
      # the rollback step below.
      - name: Verify the deploy actually landed
        id: verify
        # Bounded so a hung probe can never consume the job budget that a cold
        # provision needs (see the timeout-minutes comment at the top of this
        # job). If this step is killed by its own timeout, `failure()` still
        # fires and the rollback below still runs.
        timeout-minutes: 30
        env:
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          PROXY_IMAGE: ${{ steps.images.outputs.proxy_image }}
        run: |
          set -euo pipefail
          # --expect-image asserts each app runs EXACTLY the digest this run
          # pushed. It replaces the verifier's older "the image string must have
          # changed" heuristic, which was only sound while azd tagged every build
          # `azd-deploy-<unix-ts>`: a content-addressed digest is identical for
          # identical content, so a rebuild of the same commit could have been
          # read as "the deploy did not replace the container" and rolled back a
          # healthy release. See scripts/post-deploy-verify.py.
          if [ "${AI4IA_DEPLOY_VERIFY_CANARY:-}" = "false" ]; then
            python scripts/post-deploy-verify.py verify \
              --state "${RUNNER_TEMP}/ai4ia-deploy-state.json" \
              --expect-image "web=${WEB_IMAGE}" \
              --expect-image "api=${API_IMAGE}" \
              --expect-image "proxy=${PROXY_IMAGE}" \
              --skip-canary
            exit 0
          fi
          python scripts/post-deploy-verify.py verify \
            --state "${RUNNER_TEMP}/ai4ia-deploy-state.json" \
            --expect-image "web=${WEB_IMAGE}" \
            --expect-image "api=${API_IMAGE}" \
            --expect-image "proxy=${PROXY_IMAGE}"

      # `failure()` rather than a check on `steps.verify` alone: a deploy that dies
      # partway through has already replaced some services and is exactly as much
      # of a split-brain as a failed assertion. The capture guard keeps this inert
      # when the run failed before there was anything to restore, and the token
      # guard keeps a gate-side Entra problem from reverting a healthy release.
      #
      # Known gap: this covers a failed step, including the verification step
      # hitting its own timeout. It does NOT cover a cancelled run or the job
      # timeout, both of which kill the runner outright. See
      # docs/runbooks/deployment.md section 6.
      - name: Roll back to the captured revisions
        if: ${{ failure() && steps.capture.outcome == 'success' && steps.canary_token.outcome != 'failure' && (steps.provision.outcome != 'skipped' || steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          echo "::error::Post-deploy verification failed. Restoring the revisions captured before this deploy."
          python scripts/post-deploy-verify.py rollback \
            --state "${RUNNER_TEMP}/ai4ia-deploy-state.json"
