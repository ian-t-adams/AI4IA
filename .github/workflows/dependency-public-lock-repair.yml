name: temporary public Python lock repair

on:
  pull_request:

permissions: {}

jobs:
  lock:
    if: github.repository == 'ian-t-adams/AI4IA' && github.head_ref == 'dependabot/uv/app/api/api-deps-334ac4b7e0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Resolve the patched public dependency closure
        working-directory: app/api
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: |
          python -m pip install --quiet uv==0.12.10
          uv add --no-sync 'aiohttp>=3.14.4'
          uv lock --default-index https://pypi.org/simple --upgrade-package certifi --upgrade-package multidict
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-public-python-lock
          path: |
            app/api/uv.lock
            app/api/pyproject.toml
          retention-days: 1
          if-no-files-found: error
