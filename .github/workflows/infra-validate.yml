name: infra-validate

on:
  pull_request:
    paths:
      - "infra/**"
      - "foundry/**"
      - "scripts/gen-gateway-policy.py"
      - "scripts/tests/test_gateway_policy.py"
      - ".github/workflows/infra-validate.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "foundry/**"
      - "scripts/gen-gateway-policy.py"
      - "scripts/tests/test_gateway_policy.py"

permissions:
  contents: read

concurrency:
  group: infra-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bicep-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Validate models.json against schema
        run: |
          python -m pip install --quiet check-jsonschema
          check-jsonschema --schemafile infra/models.schema.json infra/models.json

      - name: Validate mcp-servers.json against schema
        run: check-jsonschema --schemafile infra/mcp-servers.schema.json infra/mcp-servers.json

      - name: Validate Foundry toolbox manifest against schema
        run: |
          check-jsonschema --schemafile foundry/toolbox.manifest.schema.json foundry/toolbox.manifest.json
          check-jsonschema --schemafile foundry/toolbox.manifest.schema.json foundry/toolbox.manifest.example.json

      - name: Validate Foundry routine + A2A manifests against schemas
        run: |
          check-jsonschema --schemafile foundry/routines/routine.schema.json foundry/routines/example.routine.json
          check-jsonschema --schemafile foundry/a2a/a2a.schema.json foundry/a2a/example.a2a.json

      - name: Validate catalog consistency (regions / SKUs / names)
        run: python scripts/validate-catalog.py

      - name: Validate generated gateway policy catalog
        run: |
          python scripts/gen-gateway-policy.py --check
          python -m unittest scripts.tests.test_gateway_policy

      - name: Validate deployment parameters
        run: python scripts/validate-feature-prereqs.py

      - name: Bicep build (lint)
        run: bicep build infra/main.bicep --stdout > /dev/null
