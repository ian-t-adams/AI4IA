name: infra-validate

on:
  pull_request:
    paths:
      - "infra/**"
      - "foundry/**"
      # Every script this workflow *runs* must also be a trigger path, or a
      # change to a validator does not run that validator. validate-catalog.py
      # and validate-feature-prereqs.py were being executed here without being
      # listed, so editing either one skipped the job entirely.
      - "scripts/validate-catalog.py"
      - "scripts/validate-feature-prereqs.py"
      - "scripts/tests/test_feature_prereqs.py"
      - "scripts/gen-gateway-policy.py"
      - "scripts/tests/test_gateway_policy.py"
      - "scripts/gen-voice-provider-catalog.py"
      - "scripts/tests/test_voice_provider_catalog.py"
      - ".github/workflows/infra-validate.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "foundry/**"
      - "scripts/validate-catalog.py"
      - "scripts/validate-feature-prereqs.py"
      - "scripts/tests/test_feature_prereqs.py"
      - "scripts/gen-gateway-policy.py"
      - "scripts/tests/test_gateway_policy.py"
      - "scripts/gen-voice-provider-catalog.py"
      - "scripts/tests/test_voice_provider_catalog.py"
      - ".github/workflows/infra-validate.yml"

permissions:
  contents: read

concurrency:
  group: infra-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bicep-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Bicep CLI
        env:
          BICEP_VERSION: 0.45.15
        run: |
          set -euo pipefail
          curl -sSfLo bicep \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64"
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Validate models.json against schema
        run: |
          python -m pip install --quiet check-jsonschema
          check-jsonschema --schemafile infra/models.schema.json infra/models.json

      - name: Validate mcp-servers.json against schema
        run: check-jsonschema --schemafile infra/mcp-servers.schema.json infra/mcp-servers.json

      - name: Validate voice-providers.json against schema
        run: check-jsonschema --schemafile infra/voice-providers.schema.json infra/voice-providers.json

      - name: Validate Foundry toolbox manifest against schema
        run: |
          check-jsonschema --schemafile foundry/toolbox.manifest.schema.json foundry/toolbox.manifest.json
          check-jsonschema --schemafile foundry/toolbox.manifest.schema.json foundry/toolbox.manifest.example.json

      - name: Validate Foundry routine + A2A manifests against schemas
        run: |
          check-jsonschema --schemafile foundry/routines/routine.schema.json foundry/routines/example.routine.json
          check-jsonschema --schemafile foundry/a2a/a2a.schema.json foundry/a2a/example.a2a.json

      - name: Validate catalog consistency (regions / SKUs / names)
        run: python scripts/validate-catalog.py

      - name: Validate generated gateway policy catalog
        run: |
          python scripts/gen-gateway-policy.py --check
          python -m unittest scripts.tests.test_gateway_policy

      - name: Validate generated voice provider catalog
        run: |
          python scripts/gen-voice-provider-catalog.py --check
          python -m unittest scripts.tests.test_voice_provider_catalog

      - name: Validate deployment parameters
        run: python scripts/validate-feature-prereqs.py

      # The step above resolves appEnvironment=dev (the committed default), so a
      # contradiction that only appears under the prod/entra configuration a
      # production or new-tenant standup uses would not surface until that
      # deploy. These tests drive the validator through both paths, and pin the
      # "the realtime Origin allowlist stays derived, never a literal hostname"
      # invariant that main.bicep now depends on.
      - name: Deployment parameter validator tests
        run: python -m unittest scripts.tests.test_feature_prereqs

      - name: Bicep build (lint)
        run: bicep build infra/main.bicep --stdout > /dev/null
