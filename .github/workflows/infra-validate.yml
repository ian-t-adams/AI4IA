name: infra-validate

on:
  # Not path-filtered on pull requests, so `bicep-lint-build` is always reported
  # and can be required by branch protection. See the longer note in app-ci.yml.
  #
  # The `push` filter below keeps its path list, and that list still has to name
  # every script this workflow runs: a change to a validator that is not listed
  # would not re-run that validator on main. validate-catalog.py and
  # validate-feature-prereqs.py were being executed here without being listed,
  # so editing either one skipped the job entirely.
  pull_request:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "foundry/**"
      - "scripts/validate-catalog.py"
      - "scripts/validate-feature-prereqs.py"
      - "scripts/tests/test_feature_prereqs.py"
      - "scripts/gen-gateway-policy.py"
      - "scripts/tests/test_gateway_policy.py"
      - "scripts/tests/test_policy_json_shape.py"
      - "scripts/gen-voice-provider-catalog.py"
      - "scripts/tests/test_voice_provider_catalog.py"
      - "scripts/tests/test_lean_azure_iac.py"
      - "scripts/tests/test_bicep_compilation.py"
      - "scripts/status-snapshot.ps1"
      - "site/data/services.js"
      - "proxy/SimpleL7Proxy/Config/AppConfigService.cs"
      - "app/api/pyproject.toml"
      - "docs/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/infra-validate.yml"

permissions:
  contents: read

concurrency:
  group: infra-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bicep-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bicep CLI
        env:
          BICEP_VERSION: 0.45.15
        run: |
          set -euo pipefail
          curl -sSfLo bicep \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64"
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Validate models.json against schema
        run: |
          python -m pip install --quiet check-jsonschema
          check-jsonschema --schemafile infra/models.schema.json infra/models.json

      - name: Validate mcp-servers.json against schema
        run: check-jsonschema --schemafile infra/mcp-servers.schema.json infra/mcp-servers.json

      - name: Validate voice-providers.json against schema
        run: check-jsonschema --schemafile infra/voice-providers.schema.json infra/voice-providers.json

      - name: Validate Foundry toolbox manifest against schema
        run: |
          check-jsonschema --schemafile foundry/toolbox.manifest.schema.json foundry/toolbox.manifest.json
          check-jsonschema --schemafile foundry/toolbox.manifest.schema.json foundry/toolbox.manifest.example.json

      - name: Validate Foundry routine + A2A manifests against schemas
        run: |
          check-jsonschema --schemafile foundry/routines/routine.schema.json foundry/routines/example.routine.json
          check-jsonschema --schemafile foundry/a2a/a2a.schema.json foundry/a2a/example.a2a.json
          python scripts/provision-foundry-routine.py --check
          python scripts/provision-foundry-a2a.py --check

      - name: Validate catalog consistency (regions / SKUs / names)
        run: python scripts/validate-catalog.py

      - name: Validate generated gateway policy catalog
        run: |
          python scripts/gen-gateway-policy.py --check
          python -m unittest scripts.tests.test_gateway_policy

      # A duplicate property name in any policy JObject is a RUNTIME failure that
      # compiles cleanly: Newtonsoft throws "Property with the same name already
      # exists" when the expression evaluates, so APIM answers 500 for every
      # request through the API. That is exactly how the model plane went down on
      # 2026-08-05 -- `--check` passed (the generated file matched its source) and
      # the policy compiler passed (the C# was valid). Only executing it failed.
      # This scans every committed policy file, generated and hand-written, and
      # understands both `new JObject(new JProperty(...))` and the
      # `new JObject { { "k", v } }` collection-initialiser form the hand-written
      # fragments use on the hot path.
      - name: Policy JObject duplicate-property tests
        run: python -m unittest scripts.tests.test_policy_json_shape

      - name: Validate generated voice provider catalog
        run: |
          python scripts/gen-voice-provider-catalog.py --check
          python -m unittest scripts.tests.test_voice_provider_catalog

      - name: Validate deployment parameters
        run: python scripts/validate-feature-prereqs.py

      # The step above resolves appEnvironment=dev (the committed default), so a
      # contradiction that only appears under the prod/entra configuration a
      # production or new-tenant standup uses would not surface until that
      # deploy. These tests drive the validator through both paths, and pin the
      # "the realtime Origin allowlist stays derived, never a literal hostname"
      # invariant that main.bicep now depends on.
      - name: Deployment parameter validator tests
        run: python -m unittest scripts.tests.test_feature_prereqs

      # The annotate-only Responsible AI posture runs under an approved
      # guardrails-modification exception. Its failure mode is silent — a
      # deployment that reverts to the blocking default still provisions fine and
      # only surfaces as unexplained refusals in production — so pin it here.
      - name: Responsible AI policy posture tests
        run: python -m unittest scripts.tests.test_rai_policy

      # Globally unique resource names (APIM, API Center, Foundry accounts,
      # Key Vault, storage, ACR, Cosmos, Search, Event Hubs, App Config,
      # PostgreSQL) must vary per subscription. Omitting the suffix deploys
      # fine into the subscription that already owns the name and only fails
      # in a *different* one — i.e. during a tenant migration, late in the
      # provision, after the data tier already exists.
      - name: Globally unique resource naming tests
        run: python -m unittest scripts.tests.test_bicep_naming

      # Cosmos holds the canonical store, and its backup policy is a one-way
      # door: Azure cannot move a continuous account back to periodic. The tier
      # is also a silent billing boundary — Continuous7Days stores backups for
      # free, while Continuous30Days/35Days are valid ARM that deploy and render
      # identically but start charging for backup storage. Neither a downgrade
      # nor a costly upgrade produces any deployment-time signal, so pin both.
      - name: Cosmos backup posture tests
        run: python -m unittest scripts.tests.test_cosmos_backup_policy

      - name: Lean Azure capability-map contract tests
        run: python -m unittest scripts.tests.test_lean_azure_iac

      # `bicep build` exits zero for warnings. This test captures diagnostics and
      # inspects the compiled ARM expressions, so warnings or behavior drift fail CI.
      - name: Bicep clean diagnostics and compiled behavior tests
        run: python -m unittest scripts.tests.test_bicep_compilation

      - name: Bicep build (lint)
        run: bicep build infra/main.bicep --stdout > /dev/null
