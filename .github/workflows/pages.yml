name: pages

# Publish the self-documenting portal (site/) to GitHub Pages.
#
# The portal is plain static HTML/CSS/JS (no build step) that documents AI4IA — its
# purpose, architecture, deployed Azure services, requirements and a timestamped
# deployment status snapshot.
# It links to the app (https://ai4ia.nomad-analytics.com) but stands alone.
#
# Status data: site/data/status.js + inventory.js are committed as an accurate seed and
# refreshed here. On main this job authenticates with the existing deploy
# identity (id-ai4ia-deploy) via the required credential with subject`n# `repo:ian-t-adams/AI4IA:ref:refs/heads/main` — note
# NO `environment:` is set on the build job, so the OIDC subject matches that credential
# (setting an environment would change the subject to environment:<name> and break login).
# The main-branch credential and repository variables are required. Publishing an old
# seed because Azure authentication was skipped is the stale-evidence defect this
# workflow exists to prevent, so missing configuration fails the build before upload.
#
# Docs index: site/data/docs.js is regenerated from site/data/docs.manifest.json on every
# publish (scripts/gen-docs-catalog.py) so the portal's documentation hub always reflects
# the current repo markdown — the committed docs.js is kept in sync by the quality workflow.
#
# One-time enablement: repo Settings -> Pages -> Source = "GitHub Actions". Until then the
# deploy job fails harmlessly; the build/artifact still runs.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/status-snapshot.ps1"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    # Twice daily: regenerate the timestamped status snapshot and republish.
    - cron: "0 6,18 * * *"

# id-token: write covers BOTH the Azure OIDC login (status refresh) and Pages OIDC deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages publishes at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Regenerate the portal docs index from the manifest so the published hub
      # always reflects the current repo markdown (titles, descriptions, new docs).
      - name: Regenerate portal docs index
        run: |
          set -euo pipefail
          python3 scripts/gen-docs-catalog.py

      - name: Require status snapshot credentials
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_ENV_NAME; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Pages status publication requires repository variable(s): ${missing[*]}"
            exit 1
          fi

      - name: Log in to Azure (OIDC, main-branch federated credential)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Refresh deployment status snapshot
        shell: pwsh
        run: |
          $workload = '${{ vars.AI4IA_WORKLOAD }}'
          if ([string]::IsNullOrWhiteSpace($workload)) { $workload = 'ai4ia' }
          $resourceGroup = "rg-$workload-${{ vars.AZURE_ENV_NAME }}"
          $webDomain = '${{ vars.AI4IA_WEB_CUSTOM_DOMAIN }}'
          $proxyDomain = '${{ vars.AI4IA_PROXY_CUSTOM_DOMAIN }}'
          $webUrl = if ($webDomain) { "https://$webDomain" } else { '' }
          $proxyUrl = if ($proxyDomain) { "https://$proxyDomain" } else { '' }
          ./scripts/status-snapshot.ps1 `
            -Subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" `
            -ResourceGroup $resourceGroup `
            -WebUrl $webUrl `
            -ProxyUrl $proxyUrl

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
