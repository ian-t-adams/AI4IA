name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/_generator.py"
      - "scripts/gen-docs-catalog.py"
      - "scripts/status-snapshot.ps1"
      - "scripts/status-endpoints.ps1"
      - "scripts/public_status.py"
      - "scripts/uptime.py"
      - "scripts/http_transport.py"
      - "scripts/http_contract.py"
      - "scripts/http_dependencies.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/pages-publish.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6,18 * * *"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/pages-publish.yml
    # workflow_call secrets are masked before the runner prints inputs or env.
    # No repository-variable migration or additional credential is required.
    secrets:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AI4IA_WORKLOAD: ${{ vars.AI4IA_WORKLOAD }}
      AI4IA_WEB_CUSTOM_DOMAIN: ${{ vars.AI4IA_WEB_CUSTOM_DOMAIN }}
      AI4IA_PROXY_CUSTOM_DOMAIN: ${{ vars.AI4IA_PROXY_CUSTOM_DOMAIN }}
      AI4IA_UPTIME_API_URL: ${{ vars.AI4IA_UPTIME_API_URL }}
