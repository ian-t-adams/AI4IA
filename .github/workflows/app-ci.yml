name: app-ci

on:
  pull_request:
    paths:
      - "app/**"
      - "infra/models.json"
      - "scripts/gen-model-catalog.py"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/models.json"
      - "scripts/gen-model-catalog.py"

permissions:
  contents: read

# Cancel superseded in-flight runs for the same PR/branch (CI is idempotent,
# so racing an obsolete commit's run wastes minutes).
concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    steps:
      # Actions pinned to commit SHAs (supply-chain hardening); comment tracks the tag.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Test (vitest)
        run: npm test
      - name: Build
        run: npm run build --if-present

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Model catalog drift check
        working-directory: .
        run: python scripts/gen-model-catalog.py --check
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (pyright)
        run: pyright
      - name: Test (pytest)
        run: pytest -q
