name: app-ci

on:
  pull_request:
    paths:
      - "app/**"
      - "infra/models.json"
      - "infra/mcp-servers.json"
      - "scripts/gen-model-catalog.py"
      - "scripts/gen-mcp-catalog.py"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/models.json"
      - "infra/mcp-servers.json"
      - "scripts/gen-model-catalog.py"
      - "scripts/gen-mcp-catalog.py"

permissions:
  contents: read

# Cancel superseded in-flight runs for the same PR/branch (CI is idempotent,
# so racing an obsolete commit's run wastes minutes).
concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    steps:
      # Actions pinned to commit SHAs (supply-chain hardening); comment tracks the tag.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Test (vitest)
        run: npm test
      - name: Build
        run: npm run build --if-present

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Model catalog drift check
        working-directory: .
        run: python scripts/gen-model-catalog.py --check
      - name: MCP catalog drift check
        working-directory: .
        run: python scripts/gen-mcp-catalog.py --check
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (pyright)
        run: pyright
      - name: Test (pytest)
        run: pytest -q
