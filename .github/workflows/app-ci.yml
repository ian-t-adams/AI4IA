name: app-ci

on:
  # Deliberately NOT path-filtered for pull requests, unlike the `push` trigger
  # below. A path-filtered workflow simply never reports its status contexts on a
  # PR that misses the filter, and GitHub waits forever for a required check that
  # is never reported -- so a path-filtered workflow cannot be a required check
  # without deadlocking every unrelated PR. That is why these jobs were excluded
  # from branch protection, which in turn meant a PR could break the API test
  # suite and still be mergeable.
  #
  # Always running on PRs is the cheapest fix that has no silent-skip failure
  # mode. The alternative -- keep the filter, add a `changes` job, and gate the
  # real jobs on it -- introduces custom change-detection whose bug would be
  # *worse* than the status quo: it would report success while skipping the tests
  # entirely. This costs ~2 minutes of runner time on a docs-only PR and buys a
  # gate that cannot lie.
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/models.json"
      - "infra/mcp-servers.json"
      - "infra/voice-providers.json"
      - "infra/voice-providers.schema.json"
      - "foundry/**"
      - "scripts/gen-model-catalog.py"
      - "scripts/gen-mcp-catalog.py"
      - "scripts/gen-voice-provider-catalog.py"
      - "scripts/migrate-memory-to-cosmos.py"
      - "scripts/provision-foundry-toolbox.py"
      - "scripts/provision-foundry-skills.py"
      - "scripts/provision-private-tool-catalog.py"
      - "scripts/provision-foundry-routine.py"
      - "scripts/provision-foundry-a2a.py"
      - "scripts/tests/test_voice_provider_catalog.py"
      - "scripts/tests/test_memory_cosmos_migration.py"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

# Cancel superseded in-flight runs for the same PR/branch (CI is idempotent,
# so racing an obsolete commit's run wastes minutes).
concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    steps:
      # Actions pinned to commit SHAs (supply-chain hardening); comment tracks the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Test (vitest)
        run: npm test
      - name: Build
        run: npm run build --if-present

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `foundry` (not just `dev`) so tests/test_foundry_toolbox.py's real-SDK-construction
          # cases actually run here instead of skipping via pytest.importorskip("azure.ai.projects")
          # -- CI is the only place that would otherwise exercise the >=2.3.0 toolbox model
          # classes (scripts/provision-foundry-*.py's own extra) end to end.
          pip install -e ".[dev,foundry]"
      - name: Model catalog drift check
        working-directory: .
        run: python scripts/gen-model-catalog.py --check
      - name: MCP catalog drift check
        working-directory: .
        run: python scripts/gen-mcp-catalog.py --check
      - name: Voice provider catalog drift check
        working-directory: .
        run: python scripts/gen-voice-provider-catalog.py --check
      # uv.lock is not on the install path here (CI and app/api/Dockerfile both
      # `pip install` straight from pyproject.toml), so nothing else notices when
      # it rots -- it had silently kept pypdf four releases behind, holding four
      # live CVE alerts open, and was carrying a stale fastapi ceiling too. This
      # is a pure drift gate in the same spirit as the catalog checks above: it
      # resolves nothing new and fails only when uv.lock disagrees with
      # pyproject.toml. `uv` comes from pip so no new pinned action is needed.
      - name: Dependency lock drift check (uv)
        run: |
          pip install uv
          uv lock --check
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (pyright)
        run: pyright
      - name: Test (pytest)
        run: pytest -q
      - name: Memory migration script tests
        working-directory: .
        run: pytest -q scripts/tests/test_memory_cosmos_migration.py
