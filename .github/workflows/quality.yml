name: quality

# Static linting of the repo's operational surface: GitHub Actions workflows
# (actionlint + shellcheck for embedded bash), PowerShell operator scripts
# (PSScriptAnalyzer), the AI4IA-owned Dockerfiles (hadolint), YAML (yamllint),
# the generated portal documentation index (gen-docs-catalog.py --check), and
# stdlib-only unit tests for operator scripts that aren't covered elsewhere.
# Additive/quality only - it builds and deploys nothing.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: these jobs only read the checked-out tree.
permissions:
  contents: read

# One in-flight run per workflow+ref; new pushes cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint workflows (actionlint + shellcheck)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -sSfLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          # actionlint auto-detects the shellcheck pre-installed on ubuntu-latest
          # and uses it to lint the bash inside every workflow's run: blocks.
          ./actionlint -color

  powershell:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Analyze scripts (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
            throw "PSScriptAnalyzer found $($results.Count) issue(s) at Warning+ severity."
          }
          Write-Host 'PSScriptAnalyzer: no Warning/Error findings.'

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Dockerfiles (hadolint)
        env:
          HADOLINT_VERSION: 2.14.0
        run: |
          set -euo pipefail
          curl -sSfLo hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          chmod +x hadolint
          # AI4IA-owned Dockerfiles only; proxy/SimpleL7Proxy/Dockerfile is vendored upstream.
          ./hadolint app/api/Dockerfile app/web/Dockerfile proxy/Dockerfile

  proxy-dotnet:
    name: proxy .NET build + auth tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build proxy and test AI4IA auth guard
        run: |
          dotnet build proxy/SimpleL7Proxy/SimpleL7Proxy.csproj --configuration Release --nologo
          dotnet test proxy/AI4IA.Proxy.Tests/AI4IA.Proxy.Tests.csproj --configuration Release --nologo

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint YAML (yamllint)
        env:
          YAMLLINT_VERSION: 1.38.0
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet "yamllint==${YAMLLINT_VERSION}"
          python3 -m yamllint -c .yamllint .

  docs-catalog:
    name: docs-catalog drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check portal docs index is in sync
        run: |
          set -euo pipefail
          # Fails if site/data/docs.js is stale, a listed doc is missing, a tracked
          # markdown file is untriaged (not in the manifest or its exclude list), or
          # site/data/meta.js feature posture contradicts infra/main.parameters.json.
          # Regenerate locally with: python scripts/gen-docs-catalog.py
          python3 scripts/gen-docs-catalog.py --check

  script-tests:
    name: operator script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run App Configuration postprovision tests
        run: |
          set -euo pipefail
          # Executes the real PowerShell function with az stubbed: Entra login,
          # exact optional labels, RBAC-propagation retries, and visible WARN on
          # final failure. No Azure resources or credentials are used.
          python3 -m unittest scripts.tests.test_postprovision_appconfig_sentinel

      - name: Run voice-live-canary unit tests
        run: |
          set -euo pipefail
          # scripts/voice-live-canary.py is an operator-invoked canary for the
          # governed Voice Live relay path (redacts bearer tokens/JWTs, enforces
          # wss:// + exact-path + no-query-token URL rules). Its test suite is
          # stdlib-only (aiohttp is imported lazily and mocked in tests), so no
          # dependency install is needed. It isn't run by app-ci or
          # infra-validate, so it's exercised here instead of going untested.
          python3 -m unittest scripts.tests.test_voice_live_canary

      - name: Run subscription preflight unit tests
        run: |
          set -euo pipefail
          # scripts/check-resource-providers.py and check-model-availability.py
          # are the operator preflights for standing this stack up in a new
          # subscription/tenant. Both call Azure, so CI cannot run them end to
          # end -- but their decision logic is pure and is what actually
          # prevents a partial deploy, so it is pinned here. The suite is
          # stdlib-only and makes no network calls.
          python3 -m unittest scripts.tests.test_subscription_preflight

      - name: Run Entra app provisioning guard tests
        run: |
          set -euo pipefail
          # scripts/provision-entra-apps.ps1 creates the two tenant app registrations
          # production sign-in needs. It runs once per tenant, by hand, against a live
          # directory -- so CI can never execute it, and it shipped with a call to
          # `az ad app create --spa-redirect-uris`, a flag that does not exist. stderr
          # was discarded, so the SPA app was silently never created while the script
          # printed "Done" and a repo-variable table containing a placeholder. These
          # stdlib-only, text-based checks pin the flag, the failure handling, and the
          # honesty of the admin-consent result.
          python3 -m unittest scripts.tests.test_provision_entra_apps

      - name: Run custom-domain preflight tests
        run: |
          set -euo pipefail
          # deploy.yml's custom-domain preflight is the only thing preventing two
          # failures bicep cannot prevent for itself: provisioning with an empty
          # AI4IA_*_CUSTOM_DOMAIN wipes a live vanity binding, and a first-time
          # bind dies ~20 minutes in with RequireCustomHostnameInEnvironment
          # because ARM creates the managed certificate before the ingress that
          # would register its hostname. Asserting on the YAML text would only
          # prove the step mentions the right commands, so these tests extract the
          # real `run:` block and execute it under bash with `az` stubbed. PyYAML
          # is the only dependency; the stub is pure shell.
          python3 -m pip install --user --quiet "PyYAML==${PYYAML_VERSION}"
          python3 -m unittest scripts.tests.test_custom_domain_preflight
        env:
          PYYAML_VERSION: 6.0.3

      - name: Run portal contrast tests
        run: |
          set -euo pipefail
          # site/ is a static GitHub Pages portal with no build and no test
          # runner, so its palette had no gate at all -- unlike the app's, which
          # vitest covers via globals.contrast.test.ts. It had silently drifted
          # below WCAG AA in light mode in four places (brand-2 as eyebrow/code
          # text at 2.80:1, --ok/--warn status text at ~3.15:1, and dark text on
          # the button gradient at 3.94:1). Nothing fails when this happens; the
          # page just renders slightly illegibly. stdlib-only, no network.
          python3 -m unittest scripts.tests.test_portal_contrast

      - name: Run brand asset tests
        run: |
          set -euo pipefail
          # The brand images are committed OUTPUT of scripts/gen-brand-assets.py,
          # which needs Pillow and a font and so deliberately does not run here.
          # That leaves the committed bytes ungated in three ways, each of which
          # has bitten this repo: the first orange rebrand silently left six
          # assets (including the web app's own favicon.ico) on the previous azure
          # mark at unchanged dimensions; site/index.html's og:image dimensions
          # were never checked against the real lettermark; and nothing objected
          # when the portal icon was 1024x1024 / 750 KB behind a 30px box. So this
          # decodes the actual pixels, and enumerates rasters from git so an asset
          # no generator owns cannot hide. stdlib-only, no network, ~1.5s.
          python3 -m unittest scripts.tests.test_brand_assets

      - name: Run Dependabot config coupling tests
        run: |
          set -euo pipefail
          # app-ci fails the `api` job on uv.lock drift, so whatever opens
          # dependency PRs has to move pyproject.toml and uv.lock together.
          # Dependabot's pip ecosystem does not, and uv.lock stores the declared
          # specifier, so even a no-op ceiling bump desynced it and broke every
          # Python PR. These checks stop the config drifting back to that pair.
          python3 -m pip install --user --quiet "PyYAML==${PYYAML_VERSION}"
          python3 -m unittest scripts.tests.test_dependabot_config
        env:
          PYYAML_VERSION: 6.0.3

      - name: Run lockfile provenance tests
        run: |
          set -euo pipefail
          # app-ci's `uv lock --check` only compares the lock to pyproject.toml;
          # it never looks at WHERE the artifacts resolve from. And nothing on
          # the install path reads the lock at all (Dockerfile and CI both
          # `pip install` from pyproject.toml). So a lockfile rewritten to point
          # at a different registry passes every other gate.
          #
          # Measured, not assumed: commit aad6889 committed a uv.lock with 1,659
          # lines pointing at an internal Microsoft package-feed proxy, because
          # the machine that ran `uv lock` resolves through a corporate mirror.
          # app-ci went green. It was repaired two PRs later only by coincidence,
          # when a Dependabot PR regenerated the file from PyPI. stdlib-only.
          python3 -m unittest scripts.tests.test_lockfile_provenance

      - name: Run status consistency tests
        run: |
          set -euo pipefail
          # The audit's disposition table and the roadmap are two live status
          # documents for the same findings. Nothing coupled them, and they
          # drifted the day it mattered: PR #294 set disableLocalAuth true and
          # updated the roadmap, leaving the audit asserting in the present tense
          # that it "still defaults false". Prose is not executable, so nothing
          # failed. This makes the checkable half executable -- a finding may not
          # be Open in one document and closed in the other. stdlib-only.
          python3 -m unittest scripts.tests.test_status_consistency

      - name: Run portal status publication tests
        run: |
          set -euo pipefail
          # A failed Azure login/refresh must fail Pages rather than republish an
          # old snapshot as current. The label check also keeps a deployed,
          # user-facing service from falling into the portal's opaque "Other"
          # bucket (Durable Task did exactly that).
          python3 -m pip install --user --quiet "PyYAML==${PYYAML_VERSION}"
          python3 -m unittest \
            scripts.tests.test_pages_status_refresh \
            scripts.tests.test_status_snapshot_labels
        env:
          PYYAML_VERSION: 6.0.3

      - name: Run post-deploy verification tests
        run: |
          set -euo pipefail
          # deploy.yml's post-deploy gate is the only thing that will ever tell
          # this repo that a deploy did not work, and it runs exclusively against
          # live Azure at the one moment nobody is watching -- so every branch in
          # it is untested unless it is tested here. `az` is stubbed at the
          # process boundary and HTTP at the request function, so this makes no
          # network calls and mutates nothing. The three branches that matter
          # most: the unchanged-revision assertion (the "azd said 0, Container
          # Apps promoted nothing" case the audit named), rollback target
          # selection (Single vs Multiple revision mode need different az
          # primitives, and the wrong one is a silent no-op), and redaction (the
          # canary holds a bearer token and receives model output). PyYAML is
          # needed only for the workflow-wiring assertions.
          python3 -m pip install --user --quiet "PyYAML==${PYYAML_VERSION}"
          python3 -m unittest scripts.tests.test_post_deploy_verify
        env:
          PYYAML_VERSION: 6.0.3

      - name: Run configuration-reference reachability tests
        run: |
          set -euo pipefail
          # A repo variable only influences a deploy if deploy.yml forwards it AND
          # main.parameters.json reads it via ${VAR=default}. Miss either half and
          # the operator sets it, the deploy goes green, and nothing changes.
          # Documentation is where that costs the most, because a clean-room tenant
          # standup follows the docs -- six rows of the feature-flag table named
          # variables no deploy could ever read, and AI4IA_APP_ENVIRONMENT (which
          # must be `prod` for a real environment) appeared in no document at all.
          python3 -m unittest scripts.tests.test_configuration_reference_reachability

      - name: Run teardown data-loss gate tests
        run: |
          set -euo pipefail
          # teardown.ps1 deletes an RG and PURGES the Key Vault holding per-user MCP
          # credentials. -Force only ever acknowledged the infrastructure, which azd
          # can rebuild; blobs have no restore path and purged secrets are gone. The
          # gate makes the data acknowledgement separate and explicit, and the capture
          # script records the Cosmos restorable-instance id, which stops being
          # queryable the moment the account is deleted.
          python3 -m unittest scripts.tests.test_teardown_data_loss_gate

      - name: Run Lean Azure retained-resource cleanup tests
        run: |
          set -euo pipefail
          # Incremental ARM retains resources removed from Bicep. This suite
          # executes the standalone cleanup's dry-run/refusal paths and pins its
          # exact-resource-ID and no-deployment-hook safety boundaries.
          python3 -m unittest scripts.tests.test_lean_azure_cleanup

      - name: Run documented-path reachability tests
        run: |
          set -euo pipefail
          # The Markdown link checker only validates [text](path) links. A bare
          # `app/api/tests/foo.py` in backticks is not a link, so a rename leaves the
          # doc rendering perfectly while citing a file that no longer exists -- which
          # is exactly what happened to the repository audit. For a document whose
          # value is that its claims are checkable, a citation resolving to nothing is
          # worse than no citation. Globs and CHANGELOG.md are excluded by design.
          python3 -m unittest scripts.tests.test_documented_paths_exist

      - name: Run Markdown anchor tests
        run: |
          set -euo pipefail
          # test_documented_paths_exist splits on "#" and validates only the file
          # part, so a [text](doc.md#heading) link whose heading was renamed passes
          # every existing gate while silently landing the reader at the top of the
          # document. Two such links reached main: an audit cross-reference dated
          # 2026-08-05 after the heading moved to 2026-08-08, and a roadmap link into
          # deployment.md that the greenfield/routine split retargeted. This
          # reimplements GitHub's slug algorithm (including duplicate -1/-2
          # suffixing) and refuses to pass vacuously on too few checked links.
          python3 -m unittest scripts.tests.test_markdown_anchors

      - name: Run gating-workflow tests
        run: |
          set -euo pipefail
          # GitHub waits forever for a required status check that is never
          # reported, so a path-filtered workflow cannot be a required check.
          # app-ci, infra-validate and docker-build therefore run on every PR;
          # this fails if a `paths:` filter comes back under `pull_request:`, or
          # if a job is renamed out from under the ruleset's context list.
          python3 -m pip install --user --quiet "PyYAML==${PYYAML_VERSION}"
          python3 -m unittest scripts.tests.test_gating_workflows
        env:
          PYYAML_VERSION: 6.0.3

      - name: Run Foundry asset workflow tests
        run: |
          set -euo pipefail
          # Foundry assets are preview data-plane resources outside azd/Bicep. This
          # pins the OIDC workflow's path trigger, explicit endpoint variable,
          # project-role preflight, and fail-closed reconciliation command.
          python3 -m pip install --user --quiet "PyYAML==${PYYAML_VERSION}"
          python3 -m unittest scripts.tests.test_foundry_assets_workflow
        env:
          PYYAML_VERSION: 6.0.3

      - name: Run Markdown table shape tests
        run: |
          set -euo pipefail
          # A dropped line break merges two table rows into one and the second
          # row vanishes from the rendered page; an unescaped `|` inside a code
          # span silently adds a phantom column. Both shipped in docs before this
          # existed, neither is visible in a diff, and neither breaks a link. For
          # a configuration reference, a swallowed row means an operator never
          # learns a variable exists.
          python3 -m unittest scripts.tests.test_markdown_tables

      - name: Run base image pin tests
        run: |
          set -euo pipefail
          # A tag is a mutable pointer: docker-build.yml resolves node:22-alpine
          # on the PR and deploy.yml resolves it again later, so the image CI
          # proved and the image production runs could be different builds. Both
          # app Dockerfiles now pin `tag@sha256:<digest>`. This fails if a pin is
          # dropped, if a multi-stage file desyncs its own stages, if the pinned
          # major stops tracking app-ci's toolchain version, or if a new
          # Dockerfile appears that is neither CI-built nor recorded as exempt.
          python3 -m pip install --user --quiet "PyYAML==${PYYAML_VERSION}"
          python3 -m unittest scripts.tests.test_base_image_pins
        env:
          PYYAML_VERSION: 6.0.3

      - name: Run immutable image promotion tests
        run: |
          set -euo pipefail
          # deploy.yml no longer lets `azd deploy` rebuild from source: it builds
          # each image once, reads back the registry digest, and deploys that
          # exact reference. The build/push step's real `run:` block is executed
          # here with docker and az stubbed, so the branch logic is covered
          # rather than merely mentioned; the static half guards the wiring --
          # every azure.yaml service is deployed, nothing falls back to a
          # rebuild, and the P1-6 capture/preflight/deploy/verify/rollback
          # ordering still holds.
          python3 -m pip install --user --quiet "PyYAML==${PYYAML_VERSION}"
          python3 -m unittest scripts.tests.test_immutable_image_promotion
        env:
          PYYAML_VERSION: 6.0.3
