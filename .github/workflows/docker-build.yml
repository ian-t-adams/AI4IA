name: docker-build

# Actually builds all deployable container images (never pushes anywhere) so
# base-image resolution, OS/package availability, and the dependency-install
# step are exercised on the PR that changes them. Before this workflow,
# quality.yml's hadolint job only linted Dockerfile *syntax* - it never ran
# `docker build`, so a broken/renamed base image tag, or an install failure
# specific to the pinned Python/Node version, could pass CI green and only
# surface at `azd deploy` (or worse, in production). deploy.yml owns the real
# build-and-push path at deploy time (see azure.yaml); this
# workflow is build-and-load validation only - no registry, no credentials.
#
# The proxy image is also scanned by its exact loaded image tag. That gate uses
# a reviewed, CVE-specific exception file, emits an SPDX SBOM, and retains build
# metadata so the result is about final runtime bytes rather than source files.
#
# The dockerignore-context job below builds separate, throwaway probe
# images (not the real app images) to prove app/web/.dockerignore and
# app/api/.dockerignore recursively exclude dotenv secrets from the build
# context at any depth, not just at the root.

on:
  # Not path-filtered on pull requests, so its contexts are always reported and
  # can therefore be required by branch protection. See the longer note in
  # app-ci.yml; the same reasoning applies to all three formerly path-filtered
  # workflows. The `push` filter below is unchanged -- pushes to main do not gate
  # a merge, so there is nothing to deadlock there.
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/web/**"
      - "app/api/**"
      - "proxy/**"
      - "scripts/check-image-ownership.py"
      - "scripts/tests/test_dockerignore_context.py"
      - "scripts/tests/test_base_image_pins.py"
      - ".github/workflows/docker-build.yml"

# Least privilege: these jobs only read the checked-out tree and read/write
# the GitHub Actions cache backend (implicit runner token); nothing is
# pushed to a registry.
permissions:
  contents: read

# One in-flight run per workflow+ref; new pushes cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to commit SHAs (supply-chain hardening); comment tracks the tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build web image (app/web/Dockerfile)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/web
          file: app/web/Dockerfile
          push: false
          load: true
          tags: ai4ia-web:ci
          cache-from: type=gha,scope=docker-build-web
          cache-to: type=gha,mode=max,scope=docker-build-web
      - name: Verify image was produced
        run: docker image inspect ai4ia-web:ci --format 'Built {{.RepoTags}} - {{.Size}} bytes'

  api:
    name: api image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify proxy bases are multi-platform index digests
        run: |
          set -euo pipefail
          mapfile -t refs < <(
            sed -nE \
              's/^FROM (mcr\.microsoft\.com\/dotnet\/[^ ]+@sha256:[0-9a-f]{64})( AS [^ ]+)?$/\1/p' \
              proxy/Dockerfile
          )
          if [[ "${#refs[@]}" -ne 2 ]]; then
            echo "::error::Expected exactly two pinned external proxy bases, found ${#refs[@]}."
            exit 1
          fi
          for ref in "${refs[@]}"; do
            media_type="$(
              docker buildx imagetools inspect "${ref}" \
                --format '{{.Manifest.MediaType}}'
            )"
            case "${media_type}" in
              application/vnd.oci.image.index.v1+json|\
              application/vnd.docker.distribution.manifest.list.v2+json)
                ;;
              *)
                echo "::error::${ref} resolves to ${media_type}, not a multi-platform index."
                exit 1
                ;;
            esac
          done
      - name: Build api image (app/api/Dockerfile)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/api
          file: app/api/Dockerfile
          push: false
          load: true
          tags: ai4ia-api:ci
          cache-from: type=gha,scope=docker-build-api
          cache-to: type=gha,mode=max,scope=docker-build-api
      - name: Smoke test - app package imports in the built image
        run: docker run --rm ai4ia-api:ci python -c "import ai4ia_api.main"
      - name: Smoke test - locked runtime includes lazy imports without build or optional extras
        run: |
          docker run --rm --interactive ai4ia-api:ci python - \
            < app/api/tests/test_lazy_imports_are_declared.py
      - name: Smoke test - system TZif rules support workflow calendars
        run: |
          docker run --rm --interactive ai4ia-api:ci python - \
            < app/api/tests/test_system_timezone_data.py

      - name: Build proxy image (proxy/Dockerfile)
        id: proxy-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: proxy
          file: proxy/Dockerfile
          push: false
          load: true
          tags: ai4ia-proxy:ci
          cache-from: type=gha,scope=docker-build-proxy
          cache-to: type=gha,mode=max,scope=docker-build-proxy

      - name: Capture final proxy image ID
        id: proxy-image
        run: |
          set -euo pipefail
          echo "image_id=$(docker image inspect ai4ia-proxy:ci --format '{{.Id}}')" \
            >> "${GITHUB_OUTPUT}"

      - name: Scan final proxy image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.proxy-image.outputs.image_id }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          trivyignores: proxy/.trivyignore
          version: v0.71.2

      - name: Generate proxy SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.proxy-image.outputs.image_id }}
          scanners: vuln
          format: spdx-json
          output: proxy-sbom.spdx.json
          exit-code: "0"
          version: v0.71.2

      - name: Record proxy build metadata
        env:
          IMAGE_ID: ${{ steps.proxy-image.outputs.image_id }}
        run: |
          set -euo pipefail
          jq -n \
            --arg source_repository "${GITHUB_REPOSITORY}" \
            --arg source_revision "${GITHUB_SHA}" \
            --arg image "ai4ia-proxy:ci" \
            --arg image_id "${IMAGE_ID}" \
            '{
              schemaVersion: 1,
              sourceRepository: $source_repository,
              sourceRevision: $source_revision,
              image: $image,
              localImageId: $image_id,
              signed: false,
              note: "Local content-addressed image ID; no registry digest exists for this load-only PR build. deploy.yml separately signs and verifies production registry digests."
            }' > proxy-build-provenance.json

      - name: Retain proxy SBOM and build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxy-image-evidence-${{ github.sha }}
          path: |
            proxy-sbom.spdx.json
            proxy-build-provenance.json
          if-no-files-found: error
          retention-days: 30

      # The optional CompanionApp telemetry console shares the proxy's vendored
      # source, pinned bases and exact-CVE policy. It is built and scanned on every
      # PR; production promotion is the separate, attested companion-image workflow.
      - name: Verify CompanionApp bases are multi-platform index digests
        run: |
          set -euo pipefail
          mapfile -t refs < <(
            sed -nE \
              's/^FROM (mcr\.microsoft\.com\/dotnet\/[^ ]+@sha256:[0-9a-f]{64})( AS [^ ]+)?$/\1/p' \
              proxy/CompanionApp.Dockerfile
          )
          if [[ "${#refs[@]}" -ne 2 ]]; then
            echo "::error::Expected exactly two pinned external CompanionApp bases, found ${#refs[@]}."
            exit 1
          fi
          for ref in "${refs[@]}"; do
            media_type="$(
              docker buildx imagetools inspect "${ref}" \
                --format '{{.Manifest.MediaType}}'
            )"
            case "${media_type}" in
              application/vnd.oci.image.index.v1+json|\
              application/vnd.docker.distribution.manifest.list.v2+json)
                ;;
              *)
                echo "::error::${ref} resolves to ${media_type}, not a multi-platform index."
                exit 1
                ;;
            esac
          done

      - name: Build CompanionApp image (proxy/CompanionApp.Dockerfile)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: proxy
          file: proxy/CompanionApp.Dockerfile
          push: false
          load: true
          tags: ai4ia-companion:ci
          cache-from: type=gha,scope=docker-build-companion
          cache-to: type=gha,mode=max,scope=docker-build-companion

      - name: Capture final CompanionApp image ID
        id: companion-image
        run: |
          set -euo pipefail
          echo "image_id=$(docker image inspect ai4ia-companion:ci --format '{{.Id}}')" \
            >> "${GITHUB_OUTPUT}"

      - name: Smoke test - CompanionApp runs as the non-root app user
        run: |
          set -euo pipefail
          user="$(docker image inspect ai4ia-companion:ci --format '{{.Config.User}}')"
          if [[ "${user}" != "1654" ]]; then
            echo "::error::CompanionApp image runs as '${user}', expected the non-root app user 1654."
            exit 1
          fi

      - name: Verify CompanionApp application files are root-owned
        run: |
          set -euo pipefail
          # The chiseled runtime has no shell, so read the final owners and modes
          # from the exported filesystem: the app user must not be able to replace
          # the application, and the key ring is its only owned path.
          container="$(docker create ai4ia-companion:ci)"
          trap 'docker rm --force "${container}" >/dev/null' EXIT
          docker export "${container}" | python3 scripts/check-image-ownership.py \
            --root-owned app --owned var/lib/companion/keys=1654

      - name: Smoke test - CompanionApp starts and admits only the allow-listed admin
        run: |
          set -euo pipefail
          admin="11111111-1111-1111-1111-111111111111"
          # Without an admin allow-list the app must exit, never serve (fail closed).
          docker run --detach --name companion-refused \
            --env CompanionApp__EventHubMonitor__eventhub_enabled=false ai4ia-companion:ci >/dev/null
          status="$(timeout 60 docker wait companion-refused || echo running)"
          docker rm --force companion-refused >/dev/null
          if [[ "${status}" == "running" || "${status}" == "0" ]]; then
            echo "::error::CompanionApp did not refuse to start without an admin allow-list (${status})."
            exit 1
          fi
          docker run --detach --name companion-smoke --publish 127.0.0.1:18080:8080 \
            --env CompanionApp__EventHubMonitor__eventhub_enabled=false \
            --env "CompanionApp__Admin__PrincipalIds=${admin}" ai4ia-companion:ci >/dev/null
          cleanup() {
            local rc=$?
            if [[ "${rc}" -ne 0 ]]; then
              docker logs companion-smoke 2>&1 | tail -n 40 || true
            fi
            docker rm --force companion-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          status_of() {
            local path="$1" principal="$2"
            local args=(--silent --output /dev/null --write-out '%{http_code}')
            if [[ -n "${principal}" ]]; then
              args+=(--header "X-MS-CLIENT-PRINCIPAL-ID: ${principal}")
            fi
            curl "${args[@]}" "http://127.0.0.1:18080${path}" || true
          }
          for _ in $(seq 1 60); do
            [[ "$(status_of / "${admin}")" == "200" ]] && break
            sleep 1
          done
          expect() {
            local expected="$1" path="$2" principal="$3" actual
            actual="$(status_of "${path}" "${principal}")"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error::GET ${path} (principal='${principal}') returned ${actual}, expected ${expected}."
              exit 1
            fi
          }
          expect 200 / "${admin}"
          expect 200 /eventhub "${admin}"
          expect 404 /url-tester "${admin}"
          expect 403 / ""
          expect 403 /eventhub "33333333-3333-3333-3333-333333333333"
          # Blazor is interactive only if the script the page references is actually
          # published and served from the image. Status alone is not enough: a
          # fallback page could answer 200 with HTML.
          page="$(curl --silent --fail --header "X-MS-CLIENT-PRINCIPAL-ID: ${admin}" http://127.0.0.1:18080/)"
          script="$(grep -oE '_framework/blazor\.web[^"]*\.js' <<< "${page}" | head -n 1 || true)"
          if [[ -z "${script}" ]]; then
            echo "::error::The CompanionApp page references no Blazor script."
            exit 1
          fi
          content_type_of() {
            curl --silent --output /dev/null --write-out '%{content_type}' \
              --header "X-MS-CLIENT-PRINCIPAL-ID: ${admin}" "http://127.0.0.1:18080$1" || true
          }
          for path in "/${script}" /_framework/blazor.web.js; do
            expect 200 "${path}" "${admin}"
            content_type="$(content_type_of "${path}")"
            if [[ "${content_type}" != *javascript* ]]; then
              echo "::error::GET ${path} returned content type '${content_type}', expected JavaScript."
              exit 1
            fi
            if ! curl --silent --fail --header "X-MS-CLIENT-PRINCIPAL-ID: ${admin}" \
              "http://127.0.0.1:18080${path}" | grep -q 'Blazor'; then
              echo "::error::${path} is not the Blazor script."
              exit 1
            fi
          done
          # Controls: an absent script is an HTML 404, and the real one still needs the admin.
          expect 404 /_framework/blazor.missing.js "${admin}"
          if [[ "$(content_type_of /_framework/blazor.missing.js)" == *javascript* ]]; then
            echo "::error::A missing script was served as JavaScript; the content-type check is vacuous."
            exit 1
          fi
          expect 403 "/${script}" ""

      - name: Scan final CompanionApp image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.companion-image.outputs.image_id }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          trivyignores: proxy/.trivyignore
          version: v0.71.2

      - name: Generate CompanionApp SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.companion-image.outputs.image_id }}
          scanners: vuln
          format: spdx-json
          output: companion-sbom.spdx.json
          exit-code: "0"
          version: v0.71.2

      - name: Retain CompanionApp SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-image-evidence-${{ github.sha }}
          path: companion-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  dockerignore-context:
    name: dockerignore context boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify nested dotenv secrets are excluded from build context
        run: |
          set -euo pipefail
          # Docker's .dockerignore matching is not recursive by default the
          # way Git's .gitignore is: an unanchored gitignore pattern matches
          # at any depth, but the equivalent dockerignore pattern only
          # matches at the build context root. This builds real, throwaway
          # images from app/web/.dockerignore and app/api/.dockerignore to
          # prove nested dotenv secrets are excluded at any depth while
          # committed .env.example files still survive. See
          # scripts/tests/test_dockerignore_context.py for the full
          # rationale and assertions.
          python3 -m unittest scripts.tests.test_dockerignore_context
