name: foundry-assets

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: foundry-assets-production
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile Foundry assets
    # workflow_run can also observe manual or non-main executions of deploy.
    # Reconcile automatically only for a successful main push; manual dispatch
    # remains an explicit, fail-closed operator path.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      # This resolves from the production environment. Operators must keep the
      # same-named repository variable absent so a stale lower-precedence value
      # cannot be mistaken for the workflow's effective configuration.
      AZURE_FOUNDRY_PROJECT_ENDPOINT: ${{ vars.AZURE_FOUNDRY_PROJECT_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never reconcile whatever main happens to contain later. The deploy
          # completion must provision and reconcile assets from the same commit.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Log in to Azure (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Foundry provisioning dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e "app/api[foundry]"

      - name: Validate project endpoint
        run: |
          set -euo pipefail
          test -n "$AZURE_FOUNDRY_PROJECT_ENDPOINT" || {
            echo "::error::Set AZURE_FOUNDRY_PROJECT_ENDPOINT in the production environment variables."
            exit 1
          }

      - name: Verify Foundry toolbox data-plane access
        run: |
          set -euo pipefail
          python scripts/provision-foundry-toolbox.py \
            --project-endpoint "$AZURE_FOUNDRY_PROJECT_ENDPOINT" \
            --check-access

      - name: Ensure Foundry toolbox
        run: |
          set -euo pipefail
          python scripts/provision-foundry-toolbox.py \
            --project-endpoint "$AZURE_FOUNDRY_PROJECT_ENDPOINT" \
            --create
