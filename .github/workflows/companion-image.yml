name: companion-image

# Promotes the optional CompanionApp telemetry console image
# (proxy/CompanionApp.Dockerfile). The job builds it once, pushes it to this
# environment's ACR, gates it on HIGH/CRITICAL findings, attests SLSA provenance
# and an SPDX SBOM, and verifies those attestations. It is manual and main-only.
#
# It deploys nothing. To deploy, set the AI4IA_COMPANION_APP_IMAGE repository
# variable to the digest reference this run prints, then run deploy.yml. The
# pre-provision gate there re-verifies these attestations for that exact digest
# before Bicep may reference it. The console is not an azd service, so the web,
# api and proxy digest promotion is unchanged. See the CompanionApp section of
# docs/runbooks/feature-enablement.md.

on:
  workflow_dispatch:

permissions: {}

# Serialized with deploy.yml so a promotion never races a provision.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  promote:
    name: promote CompanionApp image
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AI4IA_WORKLOAD: ${{ vars.AI4IA_WORKLOAD }}
    steps:
      - name: Require the deployment identity configuration
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_ENV_NAME; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing deployment variables: ${missing[*]}. The promotion uses the same OIDC identity and registry as deploy.yml."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned image evidence tools
        timeout-minutes: 5
        env:
          GH_VERSION: 2.100.0
          GH_ARCHIVE_SHA256: e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be
          TRIVY_VERSION: 0.71.2
          TRIVY_ARCHIVE_SHA256: 0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/ai4ia-image-tools"
          mkdir "$tools"
          # Same official release checksums as deploy.yml.
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --silent --show-error --location --max-time 120 \
            --output "$tools/gh.tar.gz" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GH_ARCHIVE_SHA256" "$tools/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$tools/gh.tar.gz" -C "$tools" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --silent --show-error --location --max-time 120 \
            --output "$tools/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_ARCHIVE_SHA256" "$tools/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$tools/trivy.tar.gz" -C "$tools" trivy
          "$tools/gh_${GH_VERSION}_linux_amd64/bin/gh" --version
          "$tools/trivy" --version | grep -Fx "Version: ${TRIVY_VERSION}"
          echo "$tools/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Log in to Azure CLI (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the CompanionApp image, recording its digest
        id: image
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # Same derivation as deploy.yml: must match infra/main.bicep's
          # `rg-${workload}-${environmentName}`.
          rg="rg-${AI4IA_WORKLOAD:-ai4ia}-${AZURE_ENV_NAME}"
          registry="$(az acr list -g "$rg" --query "[].loginServer" -o tsv)"
          if [ "$(printf '%s\n' "$registry" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected exactly one container registry in $rg."
            exit 1
          fi
          case "$registry" in
            *.azurecr.io) ;;
            *)
              echo "::error::Registry login server '$registry' is not an Azure Container Registry host."
              exit 1
              ;;
          esac
          az acr login --name "${registry%%.*}"
          env_slug="$(printf '%s' "$AZURE_ENV_NAME" | tr '[:upper:]' '[:lower:]')"
          ref="${registry}/ai4ia/companion-${env_slug}"
          docker build --platform linux/amd64 \
            --file proxy/CompanionApp.Dockerfile --tag "${ref}:${GITHUB_SHA}" proxy
          docker push "${ref}:${GITHUB_SHA}"
          # The digest the REGISTRY computed, filtered to this exact repository.
          digest=""
          while IFS= read -r candidate; do
            if [[ "$candidate" == "${ref}@"* ]]; then
              if [ -n "$digest" ]; then
                echo "::error::Ambiguous registry digests for the CompanionApp image."
                exit 1
              fi
              digest="${candidate#"${ref}@"}"
            fi
          done < <(docker image inspect "${ref}:${GITHUB_SHA}" --format '{{range .RepoDigests}}{{println .}}{{end}}')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read a registry digest for ${ref}:${GITHUB_SHA}; a mutable tag is never promoted."
            exit 1
          fi
          {
            echo "registry=${registry}"
            echo "name=${ref}"
            echo "digest=${digest}"
            echo "image=${ref}@${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Scan the pushed image for HIGH/CRITICAL vulnerabilities
        timeout-minutes: 15
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          # Registry bytes, under the proxy's exact-CVE policy: same pinned bases.
          trivy image --image-src remote --scanners vuln --severity HIGH,CRITICAL \
            --ignorefile proxy/.trivyignore --exit-code 1 --timeout 10m "$IMAGE"

      - name: Generate the CompanionApp SPDX SBOM
        timeout-minutes: 15
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/companion-evidence"
          trivy image --image-src remote --format spdx-json --list-all-pkgs \
            --timeout 10m --output "${RUNNER_TEMP}/companion-evidence/companion.spdx.json" "$IMAGE"

      - name: Attest CompanionApp build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest CompanionApp SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/companion-evidence/companion.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify this run's CompanionApp attestations
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
          REGISTRY: ${{ steps.image.outputs.registry }}
        run: |
          set -euo pipefail
          python scripts/verify-companion-image.py --enabled true \
            --image "$IMAGE" --registry "$REGISTRY" --environment "$AZURE_ENV_NAME" \
            --expect-source-commit "$GITHUB_SHA" \
            --expect-run-invocation "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"

      - name: Record the promoted digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          {
            echo "### Promoted CompanionApp image"
            echo ""
            echo "Built once from \`${GITHUB_SHA}\`, scanned, attested and verified."
            echo ""
            echo "Set the \`AI4IA_COMPANION_APP_IMAGE\` repository variable to:"
            echo ""
            echo "\`${IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
