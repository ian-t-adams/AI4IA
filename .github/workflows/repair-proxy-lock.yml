name: Temporary public proxy lock repair

on:
  pull_request:
    paths:
      - ".github/workflows/repair-proxy-lock.yml"

permissions:
  contents: read

jobs:
  restore:
    if: github.event.pull_request.number == 599
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Regenerate the complete top-level graph from public NuGet
        run: |
          dotnet restore proxy/AI4IA.Proxy.Tests/AI4IA.Proxy.Tests.csproj \
            --force-evaluate --source https://api.nuget.org/v3/index.json \
            -p:NuGetAudit=false --nologo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-proxy-lock-1201
          path: |
            proxy/AI4IA.Proxy.Tests/packages.lock.json
            proxy/SimpleL7Proxy/packages.lock.json
            proxy/Shared/packages.lock.json
            proxy/Shared-parser/packages.lock.json
          if-no-files-found: error
          retention-days: 1
