[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai4ia-api"
version = "0.1.0"
description = "AI4IA backend (FastAPI): auth, sessions, chat via the model gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Web framework. The upper bounds on fastapi + starlette are deliberate:
    # FastAPI only requires `starlette>=0.46.0` (no ceiling), so starlette can
    # silently float up to a new minor that tightens public typing. That is
    # exactly what broke the pyright gate before — Starlette narrowed
    # add_exception_handler's handler param, forcing the scoped
    # `# pyright: ignore[reportArgumentType]` in errors.py (#89). Capping both at
    # the current-known-good minor turns any future drift into an explicit,
    # CI-gated dependency bump instead of a silent type-gate break. The bounds
    # include the installed versions (fastapi 0.138.x, starlette 1.3.x), so
    # nothing is downgraded; raise them deliberately alongside a green pyright.
    "fastapi>=0.115,<0.139",
    # Starlette is FastAPI's ASGI foundation (otherwise pulled in transitively);
    # pinned directly so its upper bound is enforced independently of FastAPI's
    # loose `>=0.46.0` floor. See the fastapi note above.
    "starlette>=1.3,<1.4",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    # JWT validation for Microsoft Entra bearer tokens (auth/entra.py), RS256
    # only. PyJWT (cryptography backend) replaces python-jose, which transitively
    # pulled in the pure-Python `ecdsa` package — vulnerable to the unpatched
    # Minerva attack (CVE-2024-23342). We never use ECDSA, so dropping it removes
    # the dependency (and the alert) entirely rather than suppressing it.
    "pyjwt[crypto]>=2.8",
    "azure-identity>=1.17",
    "azure-cosmos>=4.7",
    # Async azure SDKs (azure.cosmos.aio + azure.identity.aio) require an async
    # HTTP transport at runtime; azure-core selects aiohttp by default.
    "aiohttp>=3.10",
    # Async Postgres driver for the pgvector memory store.
    # Imported lazily so the app/tests run without a live database.
    "asyncpg>=0.29",
    # Multipart form parser: required by FastAPI for the voice transcription
    # endpoint's audio file upload.
    "python-multipart>=0.0.9",
    # PDF text extraction for the document-upload feature. docx/pptx
    # are parsed with the stdlib (zipfile + ElementTree); only PDF needs a dep.
    "pypdf>=4.0",
    # Real mem0 OSS memory backend (memory_store=mem0): LLM fact-extraction +
    # consolidation over Postgres+pgvector. Pinned exactly because our integration
    # (Mem0MemoryService) depends on verified 2.0.4 internals — config keys,
    # azure_openai default_headers, the pgvector connection_pool injection point,
    # and add/search/get_all/delete_all signatures. Bump deliberately with tests.
    "mem0ai==2.0.11",
    # mem0's pgvector store uses psycopg3 + its pool. We inject our own AAD-token
    # ConnectionPool (no SQL password), so both are required at runtime. Imported
    # lazily (only when memory_store=mem0) so the app/tests run without them wired.
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # Blob storage for the document library: raw uploads + parsed
    # artifacts. Async client (azure.storage.blob.aio) reached via the api managed
    # identity; imported lazily so the app/tests run without it wired (the
    # in-memory blob store covers local/dev + unit tests).
    "azure-storage-blob>=12.20",
    # Azure AI Search data + index plane for the document chunk index.
    # Reached over the global *.search.windows.net endpoint via the api managed
    # identity (RBAC: Search Index Data Contributor + Service Contributor) — no
    # admin keys. Imported lazily (only when search_endpoint is configured) so the
    # app/tests run without it wired; the in-memory chunk store covers local/dev +
    # unit tests, and the unit tests inject fake clients.
    "azure-search-documents>=11.5",
    # Durable storage for user-registered MCP server connection secrets:
    # authenticated servers' credentials live in Azure Key Vault and only an
    # opaque reference is kept on the Cosmos record. Async client
    # (azure.keyvault.secrets.aio) reached via the api managed identity (RBAC: Key
    # Vault Secrets Officer); imported lazily so the app/tests run without it wired
    # (the in-memory secret store covers local/dev + unit tests).
    "azure-keyvault-secrets>=4.8",
    # Official Microsoft Web IQ SDK (async client) backing the default-OFF web
    # search capability (ai4ia_api.websearch). Imported lazily (only when
    # AI4IA_WEB_SEARCH_ENABLED=true and a search actually runs) so the app/tests
    # boot without it wired and the default-OFF path constructs nothing.
    "webiq>=0.1",
    # Azure Monitor metrics data plane for the admin dashboard's resource panels
    # for AI Search / Postgres / Cosmos / Container Apps platform metrics,
    # read via the api managed identity (RBAC: Monitoring Reader). Imported lazily
    # (only when a resource id is configured and a panel is requested) so the
    # app/tests boot without it wired and unconfigured panels degrade to
    # "unavailable"; unit tests inject a fake querier. Capped <2 because
    # azure-monitor-query 2.0 removed MetricsQueryClient (the class
    # metrics/azure_monitor.py imports); 1.4.1 is the last release that ships it.
    "azure-monitor-query>=1.2,<2",
    # Azure Monitor OpenTelemetry distro: exports request/dependency/exception
    # traces, metrics, and custom usage events to Application Insights. Initialized
    # ONCE at startup (logging_setup.configure_telemetry)
    # ONLY when APPLICATIONINSIGHTS_CONNECTION_STRING is set, so local/dev with no
    # connection string is a pure no-op and the SDK is never started. Pulls in the
    # OpenTelemetry API/SDK + the FastAPI/Azure-SDK instrumentations transitively.
    "azure-monitor-opentelemetry>=1.6",
    # The distro auto-instruments FastAPI (incoming) + the Azure SDKs, but NOT
    # httpx — the client the chat path uses for outbound model-gateway calls. Add
    # it so those outbound calls surface as App Insights dependencies. Activated
    # only when telemetry is configured (same connection-string gate).
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
    "ruff>=0.5",
    "pyright>=1.1.400",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai4ia_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai4ia_api/data/model_catalog.json" = "ai4ia_api/data/model_catalog.json"
"src/ai4ia_api/data/agents.json" = "ai4ia_api/data/agents.json"
"src/ai4ia_api/data/pricing.json" = "ai4ia_api/data/pricing.json"
"src/ai4ia_api/data/official_mcp_catalog.json" = "ai4ia_api/data/official_mcp_catalog.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.pyright]
# Static type gate for the shipping package. A realistic "basic" baseline catches
# genuine defects (None access, wrong args, missing attributes) without the
# strict-mode noise that untyped third-party SDKs generate. Tests are excluded —
# their fakes/fixtures are intentionally loose and would only add noise. Scoped
# relaxations for known Azure-SDK stub limitations live as `# pyright:` directives
# at the top of the affected modules so each suppression is auditable, not global.
include = ["src"]
extraPaths = ["src"]
exclude = ["**/__pycache__", ".venv", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Most Azure SDKs (cosmos, search, identity, monitor, storage, keyvault) and mem0
# ship without complete type stubs/`py.typed`; missing-stub findings are not real
# defects, so they should not fail the gate.
reportMissingTypeStubs = false
# Surface (but don't fail on) ignore comments that no longer suppress anything, so
# the cargo-culted `# type: ignore` problem this gate was added to fix can't silently
# creep back in. Warnings don't affect pyright's exit code, so the gate stays green.
reportUnnecessaryTypeIgnoreComment = "warning"
