[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai4ia-api"
version = "0.1.0"
description = "AI4IA backend (FastAPI): auth, sessions, chat via the model gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Cap FastAPI and Starlette together: Starlette's public typing can move
    # independently of FastAPI's loose lower bound and has broken pyright before.
    # Raise either ceiling only with the lockfile and a green type check.
    "fastapi>=0.141.0,<0.142",
    # Starlette is FastAPI's ASGI foundation (otherwise pulled in transitively);
    # pinned directly so its upper bound is enforced independently of FastAPI's
    # loose `>=0.46.0` floor. See the fastapi note above.
    "starlette>=1.4.1,<1.5",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "httpx>=0.27",
    # JWT validation for Microsoft Entra bearer tokens (auth/entra.py), RS256
    # only. PyJWT (cryptography backend) replaces python-jose, which transitively
    # pulled in the pure-Python `ecdsa` package — vulnerable to the unpatched
    # Minerva attack (CVE-2024-23342). We never use ECDSA, so dropping it removes
    # the dependency (and the alert) entirely rather than suppressing it.
    "pyjwt[crypto]>=2.13.0",
    "azure-identity>=1.17",
    "azure-cosmos>=4.16.2,<5",
    # Async azure SDKs (azure.cosmos.aio + azure.identity.aio) require an async
    # HTTP transport at runtime; azure-core selects aiohttp by default.
    "aiohttp>=3.14.3",
    # Multipart form parser: required by FastAPI for the voice transcription
    # endpoint's audio file upload.
    "python-multipart>=0.0.9",
    # PDF text extraction for the document-upload feature. docx/pptx
    # are parsed with the stdlib (zipfile + ElementTree); only PDF needs a dep.
    # The floor is a security bound, not a feature one: pypdf < 6.14.2 carries
    # four advisories (CVE-2026-59935/59936/59937/59938) that are all reachable
    # here, because documents/extract.py feeds user-uploaded bytes straight into
    # PdfReader + page.extract_text(). The two HIGH ones are infinite loops on an
    # unterminated inline image during exactly that text extraction, so none of
    # the existing guards stop them: _MAX_PDF_PAGES bounds how many pages we
    # visit, not how long one page takes, and the per-page `except Exception:
    # continue` cannot catch a hang. Each crafted upload would pin one
    # run_in_threadpool worker forever until the pool starves. Keep this at or
    # above 6.14.2.
    "pypdf>=6.15.0",
    # Blob storage for the document library: raw uploads + parsed
    # artifacts. Async client (azure.storage.blob.aio) reached via the api managed
    # identity; imported lazily so the app/tests run without it wired (the
    # in-memory blob store covers local/dev + unit tests).
    "azure-storage-blob>=12.20",
    # Azure AI Search data + index plane for the document chunk index.
    # Reached over the global *.search.windows.net endpoint via the api managed
    # identity (RBAC: Search Index Data Contributor + Service Contributor) — no
    # admin keys. Imported lazily (only when search_endpoint is configured) so the
    # app/tests run without it wired; the in-memory chunk store covers local/dev +
    # unit tests, and the unit tests inject fake clients.
    "azure-search-documents>=11.5",
    # Durable storage for user-registered MCP server connection secrets:
    # authenticated servers' credentials live in Azure Key Vault and only an
    # opaque reference is kept on the Cosmos record. Async client
    # (azure.keyvault.secrets.aio) reached via the api managed identity (RBAC: Key
    # Vault Secrets Officer); imported lazily so the app/tests run without it wired
    # (the in-memory secret store covers local/dev + unit tests).
    "azure-keyvault-secrets>=4.8",
    # Official Microsoft Web IQ SDK (async client) backing the default-OFF web
    # search capability (ai4ia_api.websearch). Imported lazily (only when
    # AI4IA_WEB_SEARCH_ENABLED=true and a search actually runs) so the app/tests
    # boot without it wired and the default-OFF path constructs nothing.
    "webiq>=0.1.5",
    # Azure Monitor metrics BATCH data plane (azure-monitor-querymetrics'
    # MetricsClient, the metrics:getBatch API) for the admin dashboard's resource
    # panels — AI Search / Postgres / Cosmos / Container Apps platform metrics.
    # Reached via the api managed identity, which needs Monitoring Reader at
    # SUBSCRIPTION scope (per-resource is NOT sufficient for the batch API; the grant
    # lives in infra/main.bicep). The client targets a regional endpoint supplied by
    # AI4IA_METRICS_ENDPOINT. Imported lazily (only when the endpoint + a resource id
    # are configured and a panel is requested) so the app/tests boot without it wired
    # and unconfigured panels degrade to "unavailable"; unit tests inject a fake
    # querier. It carries ONLY the metrics client: azure-monitor-query 2.0 removed
    # MetricsQueryClient, so the metrics half of that package moved here permanently.
    "azure-monitor-querymetrics>=1,<2",
    # Read-only Log Analytics queries for the admin operations/security dashboard.
    # Fixed server-owned KQL only; no user-supplied query text.
    #
    # STILL REQUIRED, despite the metrics split above: metrics/log_analytics.py
    # imports LogsQueryClient from this package. Do not drop it. The import is lazy
    # and the unit tests inject a fake querier, so removing the dependency would not
    # fail a test — it would surface as an ImportError the first time an admin opened
    # the operations panel. (An earlier revision of this comment claimed the package
    # was unused and dropped; it never was.)
    #
    # The old `<2` ceiling existed only to hold MetricsQueryClient, which is now
    # sourced from azure-monitor-querymetrics, so the reason for it is gone. Every
    # attribute log_analytics.py touches was verified present on 2.0.0 before the
    # bump: LogsQueryClient(credential) in .aio, query_workspace(workspace_id, query,
    # timespan=, server_timeout=), LogsQueryStatus.PARTIAL, and .status / .tables /
    # .partial_data / .partial_error / LogsTable.columns / .rows.
    "azure-monitor-query>=2.0.0,<3",
    # Azure Monitor OpenTelemetry distro: exports request/dependency/exception
    # traces, metrics, and custom usage events to Application Insights. Initialized
    # ONCE at startup (logging_setup.configure_telemetry)
    # ONLY when APPLICATIONINSIGHTS_CONNECTION_STRING is set, so local/dev with no
    # connection string is a pure no-op and the SDK is never started. Pulls in the
    # OpenTelemetry API/SDK + the FastAPI/Azure-SDK instrumentations transitively.
    "azure-monitor-opentelemetry>=1.8.9",
    # The distro auto-instruments FastAPI (incoming) + the Azure SDKs, but NOT
    # httpx — the client the chat path uses for outbound model-gateway calls. Add
    # it so those outbound calls surface as App Insights dependencies. Activated
    # only when telemetry is configured (same connection-string gate).
    "opentelemetry-instrumentation-httpx>=0.48b0",
    # Durable Task SDK + the Azure-managed (Durable Task Scheduler) backend, used
    # by workflows/durable.py to run multi-step workflows out of the HTTP request
    # so they survive a replica restart, deploy, or scale-in.
    #
    # A RUNTIME dependency, not an extra, even though the feature is default-off:
    # the shipped image installs `.` with no extras, so putting it in an extra
    # would make AI4IA_DURABLE_WORKFLOWS_ENABLED=true an ImportError at startup —
    # a documented knob that cannot be turned on without rebuilding. The import
    # itself is lazy (in DurableWorkflowService.start), so a flag-off deployment
    # never pays for the grpc/protobuf import.
    #
    # NOTE: the SDK's activity executor is SYNCHRONOUS — it calls the activity
    # function without awaiting and serializes the result, so an `async def`
    # activity fails with "Failed to serialize object of type 'coroutine'".
    # Verified against 1.9.0; durable.py's activities are sync bridges for exactly
    # this reason. Re-check on a major bump.
    "durabletask>=1.9.0,<2",
    "durabletask-azuremanaged>=1.9.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.14.2",
    # Ruff's ceiling is deliberate, and mirrors the fastapi/starlette reasoning
    # above: a lint gate that floats is a gate whose contract can change without a
    # code change. Ruff 0.16.0 expanded its *default* rule set, and because this
    # extra had no ceiling and `[tool.ruff.lint]` declared no explicit `select`,
    # CI's `pip install -e ".[dev]"` silently resolved 0.16.0 and turned a
    # previously-green `ruff check .` into 498 findings across every open PR --
    # with zero source changes. `select` is now pinned explicitly (see
    # [tool.ruff.lint]), which closes that specific failure mode, and the ceiling
    # keeps the remaining surface (fix behavior, rule semantics within the
    # selected set) an explicit, CI-gated bump rather than a surprise.
    "ruff>=0.16.2,<0.17",
    "pyright>=1.1.411",
    # Lets tests exercise real foundry/toolbox.manifest.schema.json validation (see
    # test_foundry_toolbox.py) instead of skipping via pytest.importorskip("jsonschema").
    "jsonschema>=4.18",
]
# Provisioning-only extra for Foundry asset scripts (scripts/provision-foundry-*.py).
# Installed by CI (see .github/workflows/app-ci.yml's `api` job) so the toolbox tests that
# construct real azure.ai.projects.models classes run for real instead of skipping via
# pytest.importorskip; NOT installed in the runtime container (the app never imports these
# SDKs at runtime -- only the operator-invoked provisioning scripts do). Operators installing
# it standalone at provisioning time: uv pip install -e "app/api[foundry]"
# azure-ai-projects is pinned EXACTLY to 2.4.0, not just floored at it: this whole extra's
# provisioner (scripts/provision-foundry-toolbox.py) and its test suite
# (tests/test_foundry_toolbox.py) are reflection-verified, field-by-field, against 2.4.0's actual
# *ToolboxTool model classes and constructor signatures (CodeInterpreterToolboxTool,
# OpenApiToolboxTool, MCPToolboxTool, AzureAISearchToolboxTool, ...). Those shapes have already
# changed twice now (the toolbox model classes plainly do not exist in 2.2.0, and 2.4.0 added a
# thirteenth type, ToolSearchToolboxTool/`toolbox_search`, which the parity test caught), so
# a floating `>=2.4.0` floor would let a bare `pip install .[foundry]` -- which is exactly what
# both CI (.github/workflows/app-ci.yml) and operators (see docs/foundry-toolbox.md) run -- silently
# resolve a newer, unreviewed release whose shapes may again differ, ignoring uv.lock's own
# resolution entirely (`pip install` does not consult uv.lock). An exact pin makes every install
# path -- pip or uv -- land on the one version this audit actually exercised. Bumping this pin is a
# deliberate, reviewed action: re-run the reflection parity test
# (test_reflection_driven_parity_covers_every_sdk_toolbox_type_and_field) against the new version
# first, fix whatever it flags, THEN raise the pin and regenerate uv.lock.
# jsonschema backs scripts/provision-foundry-toolbox.py's strict manifest-schema validation,
# which --create requires before constructing any SDK model.
foundry = [
    "azure-ai-projects==2.4.0",
    "azure-identity>=1.17",
    "jsonschema>=4.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai4ia_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai4ia_api/data/model_catalog.json" = "ai4ia_api/data/model_catalog.json"
"src/ai4ia_api/data/agents.json" = "ai4ia_api/data/agents.json"
"src/ai4ia_api/data/pricing.json" = "ai4ia_api/data/pricing.json"
"src/ai4ia_api/data/official_mcp_catalog.json" = "ai4ia_api/data/official_mcp_catalog.json"
"src/ai4ia_api/data/voice_provider_catalog.json" = "ai4ia_api/data/voice_provider_catalog.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned EXPLICITLY rather than inherited from ruff's default. This is the rule
# set the gate has always enforced (ruff's historical default: pycodestyle
# errors E4/E7/E9 + pyflakes F), but leaving it implicit made the gate's contract
# a property of the installed ruff version instead of this repo. Ruff 0.16.0
# widened the default set and instantly reddened CI on unrelated PRs. Stating the
# selection here makes `ruff check .` deterministic across ruff releases.
#
# Widening this list is welcome, but it is a deliberate change: add the rule,
# run `ruff check . --fix`, review the diff, and land it with a green pytest --
# not as a side effect of a dependency resolution.
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
# Static type gate for the shipping package. A realistic "basic" baseline catches
# genuine defects (None access, wrong args, missing attributes) without the
# strict-mode noise that untyped third-party SDKs generate. Tests are excluded —
# their fakes/fixtures are intentionally loose and would only add noise. Scoped
# relaxations for known Azure-SDK stub limitations live as `# pyright:` directives
# at the top of the affected modules so each suppression is auditable, not global.
include = ["src"]
extraPaths = ["src"]
exclude = ["**/__pycache__", ".venv", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Most Azure SDKs (cosmos, search, identity, monitor, storage, keyvault) ship
# without complete type stubs/`py.typed`; missing-stub findings are not real
# defects, so they should not fail the gate.
reportMissingTypeStubs = false
# Surface (but don't fail on) ignore comments that no longer suppress anything, so
# the cargo-culted `# type: ignore` problem this gate was added to fix can't silently
# creep back in. Warnings don't affect pyright's exit code, so the gate stays green.
reportUnnecessaryTypeIgnoreComment = "warning"
