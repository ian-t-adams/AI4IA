[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai4ia-api"
version = "0.1.0"
description = "AI4IA backend (FastAPI): auth, sessions, chat via the model gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "azure-identity>=1.17",
    "azure-cosmos>=4.7",
    # Async azure SDKs (azure.cosmos.aio + azure.identity.aio) require an async
    # HTTP transport at runtime; azure-core selects aiohttp by default.
    "aiohttp>=3.10",
    # Async Postgres driver for the pgvector memory store (Phase 5 increment B).
    # Imported lazily so the app/tests run without a live database.
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai4ia_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai4ia_api/data/model_catalog.json" = "ai4ia_api/data/model_catalog.json"
"src/ai4ia_api/data/agents.json" = "ai4ia_api/data/agents.json"
"src/ai4ia_api/data/pricing.json" = "ai4ia_api/data/pricing.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
