# gitleaks configuration for AI4IA
#
# We EXTEND the upstream default ruleset (useDefault = true) and only ADD
# narrowly-scoped allowlist entries for findings that were manually reviewed and
# confirmed to be FALSE POSITIVES (test fixtures and public identifiers). Every
# entry is justified inline. No real credential is allowlisted here.
#
# Validated locally with gitleaks v8.30.1: `gitleaks dir .` => 0 findings.

title = "AI4IA gitleaks config"

[extend]
useDefault = true

# 1) Secret-redaction unit-test fixtures.
#    These are deliberately-crafted dummy "long tokens" whose only purpose is to
#    prove the API's redaction logic masks high-entropy strings. Scoped to the
#    exact test files AND the exact literal fixture values (condition = AND), so
#    a genuine secret added to these files would still be flagged.
[[allowlists]]
description = "Dummy token fixtures for secret-redaction unit tests (not real credentials)."
condition = "AND"
paths = [
  '''app/api/tests/test_mcp_execution\.py''',
  '''app/api/tests/test_tools_registry\.py''',
]
regexes = [
  '''abcdEFGH1234567890abcdEFGH1234567890''',
  '''abcdef0123456789abcdef0123456789xx''',
]

# 2) Azure built-in RBAC role-definition GUIDs.
#    These are public, well-known Azure identifiers (e.g. "Key Vault Secrets User"
#    = 4633458b-17de-408a-b874-0445c86b69e6), not secrets: they grant no access on
#    their own and are documented at
#    learn.microsoft.com/azure/role-based-access-control/built-in-roles. Scoped to
#    the keyvault module line AND the specific role-id variable names.
[[allowlists]]
description = "Public Azure built-in role-definition GUIDs (identifiers, not secrets)."
condition = "AND"
regexTarget = "line"
paths = ['''infra/modules/keyvault\.bicep''']
regexes = ['''kvSecrets(User|Officer)RoleId''']

# 3) Browser localStorage namespace for Voice Live preferences.
#    This fixed public identifier only names a browser storage slot; it is not an
#    API key or credential. Scope the exception to the exact source path and
#    literal so any other high-entropy assignment remains blocking.
[[allowlists]]
description = "Voice Live localStorage namespace (public identifier, not a credential)."
condition = "AND"
paths = ['''app/web/src/lib/voicePreferences\.ts''']
regexes = ['''ai4ia\.voiceLive\.prefs\.v1''']

# 4) Synthetic JWT used by the Voice Live metadata-redaction regression test.
#    Commit fde9006 briefly stored this intentionally fake token as a literal;
#    the final test constructs it at runtime instead. Keep the historical scan
#    exception scoped to the exact test path and exact dummy value so any other
#    JWT-shaped value remains blocking.
[[allowlists]]
description = "Synthetic Voice Live JWT redaction fixture (not a credential)."
condition = "AND"
paths = ['''app/api/tests/test_realtime_logic\.py''']
regexes = [
  '''eyJhbGciOiJSUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.signature-value''',
]

# 5) Synthetic base64 "credential" fixture in the content-free client-events
#    telemetry schema's hostile-input test corpus. Commit 240c178 briefly
#    stored a base64-encoded textbook example credential ("alice:password") as a
#    dummy value proving `ClientEventReport`'s `extra="forbid"` rejects an
#    illegal nested field regardless of its content; a follow-up commit
#    replaced it with a low-entropy repeated-character placeholder, but that
#    original commit's diff still contains the literal. Scoped to the exact
#    historical commit AND file (by SHA, not by regex, so this entry never has
#    to repeat the secret-shaped string itself) so any other secret added to
#    this file in a different commit remains blocking.
[[allowlists]]
description = "Synthetic base64 credential-shaped fixture, replaced with a low-entropy placeholder in a follow-up commit (historical false positive in commit 240c178)."
condition = "AND"
commits = ["240c178da9db50e477e9d2eff65caacfedc1bc58"]
paths = ['''app/api/tests/test_client_events_api\.py''']

# 6) FastAPI's public Idempotency-Key request-header declaration.
#    The generic-api-key rule interprets the adjacent `max_length=128` validator
#    as a credential assignment. This is a standard HTTP header name and numeric
#    input bound, not a secret. Scope the exception to the exact router path and
#    declaration fragment so any other secret-shaped value remains blocking.
[[allowlists]]
description = "Public Idempotency-Key header declaration (protocol label, not a credential)."
condition = "AND"
regexTarget = "line"
paths = ['''app/api/src/ai4ia_api/routers/memories\.py''']
regexes = ['''alias="Idempotency-Key", max_length=128''']
