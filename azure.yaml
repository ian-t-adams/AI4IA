# Azure Developer CLI (azd) service map for AI4IA.
# Docs: https://learn.microsoft.com/azure/developer/azure-developer-cli/azd-schema
name: ai4ia
metadata:
  template: ai4ia@0.1.0

# Infrastructure is Bicep under ./infra (see infra/main.bicep).
infra:
  provider: bicep
  path: infra
  module: main

# Deployable services. The in-process agent runtime (app/api
# `ai4ia_api/agents`) runs inside `api` for v1; it can be promoted to
# its own Container App later.
services:
  web:
    project: ./app/web
    language: ts
    host: containerapp
    docker:
      path: Dockerfile
  api:
    project: ./app/api
    language: python
    host: containerapp
    docker:
      path: Dockerfile
  # proxy (SimpleL7Proxy) is provisioned by Bicep (ca-proxy-*). The upstream
  # https://github.com/microsoft/SimpleL7Proxy source is vendored into ./proxy
  # (Shared, Shared-parser, SimpleL7Proxy + Dockerfile); azd builds and pushes
  # the real image here, replacing the placeholder set by Bicep.
  proxy:
    project: ./proxy
    language: docker
    host: containerapp
    docker:
      path: Dockerfile

# Lifecycle hooks (optional). postprovision runs real smoke tests
# (scripts/postprovision.ps1) and FAILS the run (non-zero exit) when a resource
# that provision created is missing/unhealthy, so a broken deploy can't look
# successful. continueOnError is false on purpose. The posix branch also invokes
# pwsh (preinstalled on the GitHub ubuntu runner) so the same checks run in CI.
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/postprovision.ps1
      continueOnError: false
      interactive: false
    posix:
      shell: pwsh
      run: ./scripts/postprovision.ps1
      continueOnError: false
      interactive: false
